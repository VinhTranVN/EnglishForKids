<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="A1 Movers Kids" />
  <title>Cambridge A1 Movers — Học Từ Vựng & Ngữ Pháp Cho Bé</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #172033;
      --muted: #5a687d;
      --border: #e2e8f0;
      --primary: #0ea5e9;
      --primary-dark: #0284c7;
      --primary-soft: #f0f9ff;
      --success: #059669;
      --success-soft: #ecfdf5;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --amber: #d97706;
      --amber-soft: #fffbeb;
      --purple: #7c3aed;
      --purple-soft: #f5f3ff;
      --shadow: 0 10px 28px rgba(23, 32, 51, 0.06);
      --radius: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top left, #e0f2fe 0%, var(--bg) 42%, #eef2ff 100%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      padding-bottom: 56px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }

    .topbar-inner {
      max-width: 1040px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.85rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: 999px;
      transition: all 0.15s ease;
    }

    .home-link:hover {
      color: var(--primary);
      border-color: #7dd3fc;
      background: var(--primary-soft);
    }

    .app-title {
      font-weight: 800;
      font-size: 1.08rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .main-tabs {
      display: inline-flex;
      background: #eef2f7;
      padding: 4px;
      border-radius: 14px;
      gap: 4px;
    }

    .main-tab {
      border: none;
      background: transparent;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .main-tab.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .stats-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      border: 1px solid var(--border);
      background: var(--surface);
    }

    .pill-star { background: var(--amber-soft); border-color: #fde68a; color: #b45309; }
    .pill-streak { background: var(--danger-soft); border-color: #fecaca; color: #b91c1c; }

    .container {
      max-width: 1040px;
      margin: 22px auto 0;
      padding: 0 16px;
    }

    .hero-banner {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 22px 24px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .hero-banner h1 {
      font-size: clamp(1.3rem, 2.6vw, 1.75rem);
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .hero-banner p {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .badge-count {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--success-soft);
      color: var(--success);
      font-weight: 700;
      font-size: 0.82rem;
      padding: 6px 12px;
      border-radius: 999px;
    }

    .mode-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .mode-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 10px 15px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.15s ease;
    }

    .mode-btn:hover { border-color: #7dd3fc; }

    .mode-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 6px 16px rgba(14, 165, 233, 0.22);
    }

    .topic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
      gap: 14px;
    }

    .topic-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .topic-card:hover {
      transform: translateY(-3px);
      border-color: #7dd3fc;
      box-shadow: 0 14px 30px rgba(23, 32, 51, 0.09);
    }

    .topic-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .topic-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 1.4rem;
      background: var(--primary-soft);
    }

    .topic-count {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: #f1f5f9;
      color: var(--muted);
    }

    .topic-card h3 {
      font-size: 1.05rem;
      margin-bottom: 2px;
    }

    .topic-en {
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 600;
    }

    .progress-track {
      height: 7px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--success);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .study-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .study-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .btn {
      border: none;
      border-radius: 13px;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.15s ease;
    }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-success:hover { background: #047857; }
    .btn-amber { background: var(--amber-soft); color: #b45309; border: 1px solid #fde68a; }
    .btn-ghost { background: #f1f5f9; color: var(--text); }
    .btn-ghost:hover { background: #e2e8f0; }

    .btn-mini-audio {
      border: 1px solid #bae6fd;
      background: #ffffff;
      color: var(--primary-dark);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-mini-audio:hover {
      background: #e0f2fe;
    }

    .flashcard-box {
      max-width: 560px;
      margin: 0 auto;
      text-align: center;
    }

    .flashcard {
      background: linear-gradient(145deg, #ffffff, #f8fbff);
      border: 2px solid #bae6fd;
      border-radius: 24px;
      padding: 32px 22px;
      min-height: 290px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 12px 26px rgba(14, 165, 233, 0.08);
      margin-bottom: 18px;
      transition: transform 0.18s ease;
    }

    .flashcard:hover { transform: scale(1.01); }

    .fc-emoji { font-size: 3.4rem; }
    .fc-word { font-size: 2rem; font-weight: 800; color: var(--primary-dark); letter-spacing: -0.02em; }
    .fc-ipa { font-size: 1rem; color: var(--muted); font-family: monospace; }
    .fc-meaning { font-size: 1.45rem; font-weight: 800; color: var(--success); }
    .fc-example {
      background: var(--primary-soft);
      color: #0c4a6e;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.95rem;
      max-width: 460px;
      width: 100%;
    }

    .fc-example-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      text-align: left;
    }

    .fc-example-vi {
      margin-top: 6px;
      font-size: 0.86rem;
      color: var(--muted);
      text-align: left;
    }

    .audio-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .fc-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .quiz-box {
      max-width: 640px;
      margin: 0 auto;
    }

    .riddle-prompt {
      background: var(--amber-soft);
      border: 1px solid #fde68a;
      border-radius: 18px;
      padding: 20px;
      font-size: 1.12rem;
      font-weight: 600;
      color: #78350f;
      margin-bottom: 16px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .option-btn {
      background: var(--surface-2);
      border: 2px solid var(--border);
      border-radius: 15px;
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.15s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .option-btn.correct {
      background: var(--success-soft);
      border-color: var(--success);
      color: var(--success);
    }

    .option-btn.wrong {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: var(--danger);
    }

    .spell-slots {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 18px 0;
      min-height: 52px;
    }

    .slot-box {
      min-width: 42px;
      height: 48px;
      padding: 0 10px;
      border-radius: 12px;
      border: 2px dashed #7dd3fc;
      background: var(--primary-soft);
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--primary-dark);
      display: grid;
      place-items: center;
    }

    .letter-pool {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 18px;
    }

    .letter-tile {
      width: 44px;
      height: 46px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: 0 3px 0 #cbd5e1;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
    }

    .letter-tile:disabled {
      opacity: 0.35;
      cursor: default;
      box-shadow: none;
    }

    .grammar-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .formula-box {
      background: var(--purple-soft);
      border: 1px solid #ddd6fe;
      color: #5b21b6;
      font-weight: 700;
      padding: 12px 14px;
      border-radius: 12px;
      margin: 10px 0;
      font-size: 0.96rem;
    }

    .feedback-banner {
      padding: 12px 16px;
      border-radius: 14px;
      font-weight: 700;
      margin-top: 12px;
    }

    .feedback-ok { background: var(--success-soft); color: var(--success); }
    .feedback-err { background: var(--danger-soft); color: var(--danger); }

    .footer-tools {
      margin-top: 28px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-group">
        <a class="home-link" href="../index.html">← Trang chủ</a>
        <div class="app-title">⛵ A1 Movers Kids</div>
      </div>

      <nav class="main-tabs" aria-label="Phân hệ học tập">
        <button class="main-tab active" id="tabVocab" onclick="switchSection('vocab')">📚 Từ Vựng</button>
        <button class="main-tab" id="tabGrammar" onclick="switchSection('grammar')">🧩 Ngữ Pháp</button>
      </nav>

      <div class="stats-bar">
        <span class="pill pill-star">⭐ <span id="starCount">0</span></span>
        <span class="pill pill-streak">🔥 <span id="streakCount">0</span></span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero-banner">
      <div>
        <h1 id="heroTitle">Kho Từ Vựng Cambridge A1 Movers</h1>
        <p id="heroSubtitle">Luyện nghe phát âm, đoán từ qua định nghĩa và ghép chính tả chuẩn đề thi Movers.</p>
      </div>
      <div class="badge-count" id="totalWordBadge">📦 Đang tải kho từ...</div>
    </section>

    <div id="modeBar" class="mode-bar"></div>
    <div id="appContent"></div>

    <div class="footer-tools">
      <span id="dataSourceStatus">Nguồn dữ liệu: vocab_movers.js & grammar_movers.js</span>
      <button class="btn btn-ghost" onclick="resetProgress()">🔄 Đặt lại tiến độ</button>
    </div>
  </main>

  <!-- Nạp file dữ liệu tách riêng cùng thư mục MoverKids/ -->
  <script src="./vocab_movers.js"></script>
  <script src="./grammar_movers.js"></script>

  <script>
    const FALLBACK_MOVERS_TOPICS = [
      {
        id: "daily_routines",
        name: "Hoạt động hằng ngày",
        en: "Daily Routines & Actions",
        icon: "🏃",
        words: [
          { word: "awake", ipa: "/əˈweɪk/", meaning: "tỉnh giấc / thức", emoji: "⏰", example: "I was awake early this morning.", exampleVi: "Sáng nay tớ đã thức dậy sớm.", riddle: "Not asleep; awake after sleeping." },
          { word: "climb", ipa: "/klaɪm/", meaning: "leo / trèo", emoji: "🧗", example: "The children climbed the tree in the garden.", exampleVi: "Bọn trẻ trèo lên cây trong vườn.", riddle: "To go up a hill, tree, ladder, or stairs." },
          { word: "cook", ipa: "/kʊk/", meaning: "nấu ăn", emoji: "🍳", example: "Dad cooked pasta for dinner last night.", exampleVi: "Tối qua bố nấu mì ống cho bữa tối.", riddle: "To make food hot and ready to eat." },
          { word: "carry", ipa: "/ˈkær.i/", meaning: "mang / xách", emoji: "🎒", example: "She carried a heavy bag to school.", exampleVi: "Cô ấy xách một chiếc túi nặng tới trường.", riddle: "To hold something and move it from one place to another." },
          { word: "drop", ipa: "/drɒp/", meaning: "làm rơi / nhỏ giọt", emoji: "💧", example: "Be careful not to drop your glass.", exampleVi: "Cẩn thận đừng làm rơi cốc của bạn.", riddle: "To let something fall by accident." },
          { word: "invite", ipa: "/ɪnˈvaɪt/", meaning: "mời", emoji: "💌", example: "We invited our friends to the birthday party.", exampleVi: "Chúng tớ mời các bạn tới tiệc sinh nhật.", riddle: "To ask someone to come to a party, meal, or event." }
        ]
      },
      {
        id: "places_town",
        name: "Địa điểm trong thị trấn",
        en: "Places Around Town",
        icon: "🏥",
        words: [
          { word: "hospital", ipa: "/ˈhɒs.pɪ.təl/", meaning: "bệnh viện", emoji: "🏥", example: "The doctor works at the city hospital.", exampleVi: "Bác sĩ làm việc ở bệnh viện thành phố.", riddle: "A large place where sick or hurt people get care." },
          { word: "library", ipa: "/ˈlaɪ.brər.i/", meaning: "thư viện", emoji: "📚", example: "We borrow storybooks from the school library.", exampleVi: "Chúng tớ mượn truyện từ thư viện trường.", riddle: "A quiet place with many books you can read or borrow." },
          { word: "market", ipa: "/ˈmɑː.kɪt/", meaning: "khu chợ", emoji: "🧺", example: "Mum buys fresh fruit at the weekend market.", exampleVi: "Mẹ mua trái cây tươi ở chợ cuối tuần.", riddle: "A place where people buy and sell food or goods." },
          { word: "supermarket", ipa: "/ˈsuː.pəˌmɑː.kɪt/", meaning: "siêu thị", emoji: "🛒", example: "There is a big supermarket near our house.", exampleVi: "Có một siêu thị lớn gần nhà tớ.", riddle: "A large shop selling food, drinks, and household things." },
          { word: "cinema", ipa: "/ˈsɪn.ə.mə/", meaning: "rạp chiếu phim", emoji: "🎬", example: "We watched a funny film at the cinema.", exampleVi: "Chúng tớ xem một bộ phim vui ở rạp.", riddle: "A place with a big screen where people watch films." },
          { word: "station", ipa: "/ˈsteɪ.ʃən/", meaning: "nhà ga / trạm", emoji: "🚆", example: "We waited for the train at the station.", exampleVi: "Chúng tớ đợi tàu hỏa ở nhà ga.", riddle: "A place where trains or buses stop for passengers." }
        ]
      }
    ];

    const FALLBACK_MOVERS_GRAMMAR = [
      {
        id: "past_simple",
        title: "1. Thì Quá khứ đơn (Past Simple)",
        formula: "S + V2/ed  |  Phủ định: didn't + V  |  Nghi vấn: Did + S + V?",
        tip: "Dùng cho hành động đã xảy ra và kết thúc trong quá khứ (yesterday, last week, ago).",
        example: "We went to the zoo last Sunday.",
        questions: [
          { q: "She ___ a funny comic yesterday afternoon.", opts: ["read", "reads", "reading"], ans: 0, exp: "Hành động xảy ra 'yesterday afternoon' dùng quá khứ đơn ('read' phát âm /red/)." },
          { q: "Did you ___ your homework last night?", opts: ["do", "did", "doing"], ans: 0, exp: "Sau trợ động từ 'Did', động từ chính giữ nguyên mẫu ('do')." }
        ]
      },
      {
        id: "comparatives",
        title: "2. So sánh hơn & So sánh nhất",
        formula: "Adj-er + than  |  the + Adj-est  |  good -> better -> best",
        tip: "So sánh 2 vật/người dùng '-er than'; so sánh từ 3 trở lên dùng 'the ...-est'.",
        example: "A whale is bigger than a dolphin.",
        questions: [
          { q: "My bag is ___ than yours.", opts: ["heavier", "heavy", "heaviest"], ans: 0, exp: "So sánh hơn giữa hai chiếc túi: 'heavy' đổi 'y' thành 'i' + '-er' -> 'heavier'." },
          { q: "Tom is the ___ runner in our class.", opts: ["fast", "faster", "fastest"], ans: 2, exp: "Nhất trong cả lớp dùng so sánh nhất 'the fastest'." }
        ]
      }
    ];

    function resolveTopics() {
      if (Array.isArray(window.MOVERS_VOCAB_TOPICS) && window.MOVERS_VOCAB_TOPICS.length > 0) {
        return window.MOVERS_VOCAB_TOPICS;
      }
      if (Array.isArray(window.VOCAB_MOVERS) && window.VOCAB_MOVERS.length > 0) {
        return window.VOCAB_MOVERS;
      }
      return FALLBACK_MOVERS_TOPICS;
    }

    function resolveGrammar() {
      if (Array.isArray(window.MOVERS_GRAMMAR_LESSONS) && window.MOVERS_GRAMMAR_LESSONS.length > 0) {
        return window.MOVERS_GRAMMAR_LESSONS;
      }
      if (Array.isArray(window.GRAMMAR_MOVERS) && window.GRAMMAR_MOVERS.length > 0) {
        return window.GRAMMAR_MOVERS;
      }
      return FALLBACK_MOVERS_GRAMMAR;
    }

    const MOVERS_TOPICS = resolveTopics();
    const MOVERS_WORDS = MOVERS_TOPICS.flatMap((t) =>
      (t.words || []).map((w) => ({ ...w, topicId: t.id, topicName: t.name }))
    );
    const MOVERS_GRAMMAR = resolveGrammar();

    const STORAGE_KEY = "movers_kids_progress_v1";
    let state = loadState();
    let currentSection = "vocab";
    let vocabMode = "topics";
    let selectedTopicId = MOVERS_TOPICS[0] ? MOVERS_TOPICS[0].id : "";
    let currentDeckWords = [];
    let cardIndex = 0;
    let cardFlipped = false;
    let quizItem = null;
    let quizAnswered = false;
    let quizChosenWord = "";
    let spellLetters = [];
    let spellPicked = [];
    let grammarMode = "lessons";
    let gQuizIndex = 0;
    let gQuizAnswered = false;

    function escJs(str) {
      return String(str || "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, "&quot;")
        .replace(/\n/g, " ");
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        return {
          stars: saved.stars || 0,
          streak: saved.streak || 0,
          mastered: Array.isArray(saved.mastered) ? saved.mastered : [],
          reviewWords: Array.isArray(saved.reviewWords) ? saved.reviewWords : []
        };
      } catch (e) {
        return { stars: 0, streak: 0, mastered: [], reviewWords: [] };
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
      document.getElementById("starCount").textContent = state.stars;
      document.getElementById("streakCount").textContent = state.streak;
    }

    function addStar(points = 1) {
      state.stars += points;
      state.streak += 1;
      saveState();
    }

    function breakStreak(word) {
      state.streak = 0;
      if (word && !state.reviewWords.includes(word)) {
        state.reviewWords.push(word);
      }
      saveState();
    }

    function speak(text, rate = 0.95) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-GB";
      u.rate = rate;
      window.speechSynthesis.speak(u);
    }

    function getExampleVi(item) {
      if (item.exampleVi) return item.exampleVi;
      if (item.example_vi) return item.example_vi;
      return `Nghĩa từ: ${item.meaning}.`;
    }

    function getActiveWords() {
      if (vocabMode === "review") {
        const list = MOVERS_WORDS.filter((w) => state.reviewWords.includes(w.word));
        return list.length ? list : MOVERS_WORDS.slice(0, 10);
      }
      const topic = MOVERS_TOPICS.find((t) => t.id === selectedTopicId) || MOVERS_TOPICS[0];
      return topic ? topic.words : [];
    }

    function switchSection(sec) {
      currentSection = sec;
      document.getElementById("tabVocab").classList.toggle("active", sec === "vocab");
      document.getElementById("tabGrammar").classList.toggle("active", sec === "grammar");

      if (sec === "vocab") {
        document.getElementById("heroTitle").textContent = "Kho Từ Vựng Cambridge A1 Movers";
        document.getElementById("heroSubtitle").textContent = "Học theo chủ đề, nghe 2 tốc độ, đố định nghĩa và luyện chính tả.";
        document.getElementById("totalWordBadge").textContent = `📦 ${MOVERS_TOPICS.length} chủ đề • ${MOVERS_WORDS.length} từ vựng`;
      } else {
        document.getElementById("heroTitle").textContent = "Ngữ Pháp Trọng Tâm A1 Movers";
        document.getElementById("heroSubtitle").textContent = "Các chuyên đề ngữ pháp nền tảng kèm mẹo nhớ và bài tập trắc nghiệm.";
        document.getElementById("totalWordBadge").textContent = `🧩 ${MOVERS_GRAMMAR.length} chuyên đề ngữ pháp`;
      }
      render();
    }

    function setVocabMode(mode) {
      vocabMode = mode;
      cardIndex = 0;
      cardFlipped = false;
      quizAnswered = false;
      quizChosenWord = "";
      currentDeckWords = getActiveWords();
      if (mode === "riddle") prepareRiddle();
      if (mode === "spelling") prepareSpelling();
      render();
    }

    function openTopic(topicId) {
      selectedTopicId = topicId;
      setVocabMode("flashcard");
    }

    function stepCard(delta) {
      const deck = currentDeckWords.length ? currentDeckWords : getActiveWords();
      if (!deck.length) return;
      cardIndex = (cardIndex + delta + deck.length) % deck.length;
      cardFlipped = false;
      render();
    }

    function prepareRiddle() {
      const pool = getActiveWords();
      if (!pool.length) return;
      const target = pool[Math.floor(Math.random() * pool.length)];
      const distractors = MOVERS_WORDS.filter((w) => w.word !== target.word)
        .sort(() => Math.random() - 0.5)
        .slice(0, 3);
      const options = [target, ...distractors].sort(() => Math.random() - 0.5);
      quizItem = { target, options };
      quizAnswered = false;
      quizChosenWord = "";
    }

    function prepareSpelling() {
      const pool = getActiveWords();
      if (!pool.length) return;
      const target = pool[cardIndex % pool.length];
      quizItem = { target };
      quizAnswered = false;
      const chars = target.word.split("");
      spellLetters = chars
        .map((ch, idx) => ({ ch, idx }))
        .sort(() => Math.random() - 0.5);
      spellPicked = [];
    }

    function renderModeBar() {
      const bar = document.getElementById("modeBar");
      if (currentSection === "vocab") {
        const modes = [
          { id: "topics", label: "🗂️ Chọn Chủ Đề" },
          { id: "flashcard", label: "🃏 Flashcard" },
          { id: "riddle", label: "❓ Đố Định Nghĩa" },
          { id: "spelling", label: "🐝 Chính Tả" },
          { id: "review", label: `🔁 Ôn Từ Khó (${state.reviewWords.length})` }
        ];
        bar.innerHTML = modes
          .map((m) => `<button class="mode-btn ${vocabMode === m.id ? "active" : ""}" onclick="setVocabMode('${m.id}')">${m.label}</button>`)
          .join("");
      } else {
        bar.innerHTML = `
          <button class="mode-btn ${grammarMode === "lessons" ? "active" : ""}" onclick="grammarMode='lessons';render()">📖 Thẻ Công Thức</button>
          <button class="mode-btn ${grammarMode === "quiz" ? "active" : ""}" onclick="grammarMode='quiz';gQuizIndex=0;gQuizAnswered=false;render()">🎯 Trắc Nghiệm Ngữ Pháp</button>
        `;
      }
    }

    function render() {
      renderModeBar();
      const root = document.getElementById("appContent");

      if (currentSection === "grammar") {
        renderGrammar(root);
        return;
      }

      if (vocabMode === "topics") {
        root.innerHTML = `
          <div class="topic-grid">
            ${MOVERS_TOPICS.map((t) => {
              const words = t.words || [];
              const done = words.filter((w) => state.mastered.includes(w.word)).length;
              const pct = words.length ? Math.round((done / words.length) * 100) : 0;
              return `
                <article class="topic-card" onclick="openTopic('${escJs(t.id)}')">
                  <div>
                    <div class="topic-head">
                      <div class="topic-icon">${t.icon || "📘"}</div>
                      <span class="topic-count">${done}/${words.length} từ</span>
                    </div>
                    <h3>${t.name}</h3>
                    <div class="topic-en">${t.en || ""}</div>
                  </div>
                  <div class="progress-track">
                    <div class="progress-fill" style="width:${pct}%"></div>
                  </div>
                </article>
              `;
            }).join("")}
          </div>
        `;
        return;
      }

      const topic = MOVERS_TOPICS.find((t) => t.id === selectedTopicId) || MOVERS_TOPICS[0];
      currentDeckWords = getActiveWords();
      const words = currentDeckWords;

      if (!words.length) {
        root.innerHTML = `<div class="study-panel"><p>Chưa có từ vựng trong mục này.</p></div>`;
        return;
      }

      if (vocabMode === "flashcard" || vocabMode === "review") {
        if (vocabMode === "review" && state.reviewWords.length === 0) {
          root.innerHTML = `
            <div class="study-panel" style="text-align:center;padding:40px 20px;">
              <h2>🎉 Tuyệt vời! Bé chưa có từ khó nào cần ôn lại.</h2>
              <p style="color:var(--muted);margin:10px 0 18px;">Hãy luyện thêm ở các chủ đề hoặc thử sức với trò Đố Định Nghĩa nhé.</p>
              <button class="btn btn-primary" onclick="setVocabMode('topics')">Chọn chủ đề học tiếp</button>
            </div>
          `;
          return;
        }

        const item = words[cardIndex % words.length];
        const isMastered = state.mastered.includes(item.word);
        root.innerHTML = `
          <div class="study-panel">
            <div class="study-header">
              <strong>${vocabMode === "review" ? "🔁 Ôn tập từ khó" : `${topic.icon || "📘"} ${topic.name}`} (${(cardIndex % words.length) + 1}/${words.length})</strong>
              <button class="btn btn-ghost" onclick="setVocabMode('topics')">← Đổi chủ đề</button>
            </div>

            <div class="flashcard-box">
              <div class="audio-row">
                <button class="btn btn-primary" onclick="speak('${escJs(item.word)}', 0.95)">🔊 Nghe thường</button>
                <button class="btn btn-amber" onclick="speak('${escJs(item.word)}', 0.6)">🐢 Nghe chậm</button>
              </div>

              <div class="flashcard" onclick="cardFlipped=!cardFlipped;render()">
                <div class="fc-emoji">${item.emoji || "🔤"}</div>
                <div class="fc-word">${item.word}</div>
                <div class="fc-ipa">${item.ipa || ""}</div>
                ${
                  cardFlipped
                    ? `<div class="fc-meaning">${item.meaning}</div>
                       <div class="fc-example">
                         <div class="fc-example-row">
                           <span>“${item.example || ""}”</span>
                           <button class="btn-mini-audio" onclick="event.stopPropagation();speak('${escJs(item.example || item.word)}', 0.9)">🔊 Nghe ví dụ</button>
                         </div>
                         <div class="fc-example-vi">🇻🇳 ${getExampleVi(item)}</div>
                       </div>`
                    : `<div style="color:var(--muted);font-size:0.9rem;">👆 Chạm vào thẻ để xem nghĩa &amp; ví dụ</div>`
                }
              </div>

              <div class="fc-controls">
                <button class="btn btn-ghost" onclick="stepCard(-1)">← Trước</button>
                <button class="btn btn-success" onclick="markMastered('${escJs(item.word)}')">
                  ${isMastered ? "✅ Đã thuộc" : "⭐ Đánh dấu đã thuộc"}
                </button>
                <button class="btn btn-amber" onclick="markReview('${escJs(item.word)}')">📌 Cần ôn lại</button>
                <button class="btn btn-primary" onclick="stepCard(1)">Tiếp →</button>
              </div>
            </div>
          </div>
        `;
        return;
      }

      if (vocabMode === "riddle") {
        if (!quizItem) prepareRiddle();
        const { target, options } = quizItem;
        root.innerHTML = `
          <div class="study-panel">
            <div class="study-header">
              <strong>❓ Đố Vui Định Nghĩa — Chủ đề: ${topic.name}</strong>
              <button class="btn btn-ghost" onclick="setVocabMode('topics')">← Đổi chủ đề</button>
            </div>

            <div class="quiz-box">
              <div class="riddle-prompt">
                💡 <em>"${target.riddle || target.meaning}"</em>
                <div style="margin-top:10px;">
                  <button class="btn btn-amber" onclick="speak('${escJs(target.riddle || target.word)}', 0.9)">🔊 Nghe câu gợi ý</button>
                </div>
              </div>

              <div class="options-grid">
                ${options
                  .map((opt) => {
                    let cls = "option-btn";
                    if (quizAnswered) {
                      if (opt.word === target.word) cls += " correct";
                      else if (opt.word === quizChosenWord) cls += " wrong";
                    }
                    return `<button class="${cls}" ${quizAnswered ? "disabled" : ""} onclick="checkRiddle('${escJs(opt.word)}')">
                      <span>${opt.emoji || "🔤"}</span>
                      <span>${opt.word}</span>
                    </button>`;
                  })
                  .join("")}
              </div>

              ${
                quizAnswered
                  ? `<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;flex-wrap:wrap;">
                       <span><strong>${target.word}</strong> (${target.ipa || ""}): ${target.meaning}</span>
                       <button class="btn btn-primary" onclick="prepareRiddle();render()">Câu tiếp theo →</button>
                     </div>`
                  : ""
              }
            </div>
          </div>
        `;
        return;
      }

      if (vocabMode === "spelling") {
        if (!quizItem) prepareSpelling();
        const { target } = quizItem;
        const currentGuess = spellPicked.map((i) => spellLetters[i].ch).join("");
        const isComplete = currentGuess.length === target.word.length;
        const isRight = currentGuess.toLowerCase() === target.word.toLowerCase();

        root.innerHTML = `
          <div class="study-panel">
            <div class="study-header">
              <strong>🐝 Thử Thách Chính Tả — ${topic.name}</strong>
              <button class="btn btn-ghost" onclick="setVocabMode('topics')">← Đổi chủ đề</button>
            </div>

            <div class="flashcard-box">
              <div style="font-size:3rem;margin-bottom:6px;">${target.emoji || "🔤"}</div>
              <div style="font-size:1.2rem;font-weight:800;margin-bottom:4px;">${target.meaning}</div>
              <div style="color:var(--muted);font-size:0.9rem;margin-bottom:12px;">${target.riddle || ""}</div>

              <div class="audio-row">
                <button class="btn btn-primary" onclick="speak('${escJs(target.word)}', 0.9)">🔊 Nghe từ</button>
                <button class="btn btn-amber" onclick="speak('${escJs(target.word)}', 0.55)">🐢 Đọc chậm</button>
              </div>

              <div class="spell-slots">
                ${target.word
                  .split("")
                  .map((_, i) => `<div class="slot-box">${spellPicked[i] !== undefined ? spellLetters[spellPicked[i]].ch : ""}</div>`)
                  .join("")}
              </div>

              <div class="letter-pool">
                ${spellLetters
                  .map(
                    (item, idx) =>
                      `<button class="letter-tile" ${spellPicked.includes(idx) ? "disabled" : ""} onclick="pickLetter(${idx})">${item.ch}</button>`
                  )
                  .join("")}
              </div>

              <div class="fc-controls">
                <button class="btn btn-ghost" onclick="spellPicked.pop();render()">⌫ Xóa 1 chữ</button>
                <button class="btn btn-ghost" onclick="spellPicked=[];render()">🔄 Xếp lại</button>
                <button class="btn btn-primary" onclick="cardIndex++;prepareSpelling();render()">Từ tiếp theo →</button>
              </div>

              ${
                isComplete
                  ? `<div class="feedback-banner ${isRight ? "feedback-ok" : "feedback-err"}">
                       ${
                         isRight
                           ? `🎉 Chính xác tuyệt đối! "${target.word}" (+2 ⭐)`
                           : `❌ Chưa đúng rồi (${currentGuess}). Đáp án đúng là: <strong>${target.word}</strong>`
                       }
                     </div>`
                  : ""
              }
            </div>
          </div>
        `;
      }
    }

    function markMastered(word) {
      if (!state.mastered.includes(word)) {
        state.mastered.push(word);
        addStar(1);
      }
      state.reviewWords = state.reviewWords.filter((w) => w !== word);
      saveState();
      render();
    }

    function markReview(word) {
      if (!state.reviewWords.includes(word)) state.reviewWords.push(word);
      saveState();
      stepCard(1);
    }

    function checkRiddle(chosen) {
      quizAnswered = true;
      quizChosenWord = chosen;
      const target = quizItem.target;
      speak(target.word, 0.95);
      if (chosen === target.word) {
        addStar(1);
        if (!state.mastered.includes(target.word)) state.mastered.push(target.word);
      } else {
        breakStreak(target.word);
      }
      saveState();
      render();
    }

    function pickLetter(idx) {
      const target = quizItem.target;
      if (spellPicked.length >= target.word.length) return;
      spellPicked.push(idx);
      const currentGuess = spellPicked.map((i) => spellLetters[i].ch).join("");
      if (currentGuess.length === target.word.length) {
        speak(target.word, 0.95);
        if (currentGuess.toLowerCase() === target.word.toLowerCase()) {
          addStar(2);
          if (!state.mastered.includes(target.word)) state.mastered.push(target.word);
        } else {
          breakStreak(target.word);
        }
        saveState();
      }
      render();
    }

    function renderGrammar(root) {
      if (grammarMode === "lessons") {
        root.innerHTML = MOVERS_GRAMMAR.map(
          (g) => `
            <article class="grammar-card">
              <h3>🧩 ${g.title}</h3>
              <div class="formula-box">${g.formula}</div>
              <p style="margin-bottom:8px;"><strong>Mẹo nhớ:</strong> ${g.tip}</p>
              <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;">
                <span>📌 Ví dụ: <em>${g.example}</em></span>
                <button class="btn btn-primary" onclick="speak('${escJs(g.example)}', 0.9)">🔊 Nghe ví dụ</button>
              </div>
            </article>
          `
        ).join("");
        return;
      }

      const allQ = MOVERS_GRAMMAR.flatMap((g) => (g.questions || []).map((q) => ({ ...q, topic: g.title })));
      if (!allQ.length) {
        root.innerHTML = `<div class="study-panel"><p>Chưa có câu hỏi ngữ pháp.</p></div>`;
        return;
      }
      const item = allQ[gQuizIndex % allQ.length];
      root.innerHTML = `
        <div class="study-panel">
          <div class="study-header">
            <strong>🎯 Câu ${(gQuizIndex % allQ.length) + 1}/${allQ.length} — ${item.topic}</strong>
          </div>
          <div class="quiz-box">
            <div class="riddle-prompt">${item.q}</div>
            <div class="options-grid">
              ${item.opts
                .map((opt, idx) => {
                  let cls = "option-btn";
                  if (gQuizAnswered && idx === item.ans) cls += " correct";
                  return `<button class="${cls}" ${gQuizAnswered ? "disabled" : ""} onclick="answerGrammar(${idx}, ${item.ans})">${opt}</button>`;
                })
                .join("")}
            </div>
            ${
              gQuizAnswered
                ? `<div class="feedback-banner feedback-ok">💡 Giải thích: ${item.exp}</div>
                   <div style="margin-top:14px;text-align:right;">
                     <button class="btn btn-primary" onclick="gQuizIndex++;gQuizAnswered=false;render()">Câu tiếp theo →</button>
                   </div>`
                : ""
            }
          </div>
        </div>
      `;
    }

    function answerGrammar(chosen, ans) {
      gQuizAnswered = true;
      if (chosen === ans) addStar(1);
      else breakStreak();
      render();
    }

    function resetProgress() {
      if (!confirm("Bạn có chắc muốn đặt lại toàn bộ Sao và tiến độ học Movers trên thiết bị này?")) return;
      state = { stars: 0, streak: 0, mastered: [], reviewWords: [] };
      saveState();
      render();
    }

    saveState();
    const hasExternalVocab = Array.isArray(window.MOVERS_VOCAB_TOPICS) || Array.isArray(window.VOCAB_MOVERS);
    const hasExternalGrammar = Array.isArray(window.MOVERS_GRAMMAR_LESSONS) || Array.isArray(window.GRAMMAR_MOVERS);
    document.getElementById("dataSourceStatus").textContent =
      hasExternalVocab && hasExternalGrammar
        ? `✅ Đã nạp vocab_movers.js & grammar_movers.js (${MOVERS_WORDS.length} từ / ${MOVERS_TOPICS.length} chủ đề)`
        : `⚠️ Đang chạy dữ liệu mẫu dự phòng (${MOVERS_WORDS.length} từ) — hãy đặt vocab_movers.js & grammar_movers.js cùng thư mục MoverKids/`;
    switchSection("vocab");
  </script>
</body>
</html>
