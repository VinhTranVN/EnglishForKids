<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Cambridge Kids" />
  <title>Cambridge Kids — Học Từ Vựng & Ngữ Pháp Cho Bé</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #172033;
      --muted: #5a687d;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-soft: #eff6ff;
      --success: #059669;
      --success-soft: #ecfdf5;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --amber: #d97706;
      --amber-soft: #fffbeb;
      --shadow: 0 10px 28px rgba(15, 23, 42, 0.06);
      --radius-xl: 22px;
      --radius-lg: 16px;
      --radius-md: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    /* Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }

    .topbar-inner {
      max-width: 1040px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.85rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: 999px;
      transition: all 0.15s ease;
    }

    .home-link:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .app-title {
      font-weight: 800;
      font-size: 1.06rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .main-tabs {
      display: inline-flex;
      background: #eef2f7;
      padding: 4px;
      border-radius: 14px;
      gap: 4px;
    }

    .main-tab {
      border: none;
      background: transparent;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .main-tab.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .stats-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      border: 1px solid var(--border);
      background: var(--surface);
    }

    .pill-star { background: var(--amber-soft); border-color: #fde68a; color: #b45309; }
    .pill-streak { background: var(--danger-soft); border-color: #fecaca; color: #b91c1c; }

    /* Container */
    .container {
      max-width: 1040px;
      margin: 0 auto;
      padding: 20px 16px 48px;
    }

    .hero-banner {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #ffffff;
      border-radius: var(--radius-xl);
      padding: 20px 22px;
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: var(--shadow);
    }

    .hero-banner h1 {
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .hero-banner p {
      font-size: 0.9rem;
      opacity: 0.92;
    }

    .level-switcher {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .lvl-chip {
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 999px;
      color: rgba(255, 255, 255, 0.92);
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.28);
      transition: all 0.15s ease;
    }

    .lvl-chip.active {
      background: #ffffff;
      color: var(--primary-dark);
      border-color: #ffffff;
    }

    .mode-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .mode-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .mode-btn:hover { border-color: var(--primary); color: var(--primary); }
    .mode-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    /* Topic Grid */
    .topics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 14px;
    }

    .topic-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .topic-card:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
      box-shadow: var(--shadow);
    }

    .topic-icon { font-size: 2rem; }
    .topic-name { font-weight: 800; font-size: 1.05rem; }
    .topic-sub { color: var(--muted); font-size: 0.84rem; }

    .progress-track {
      height: 7px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--success);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    /* Flashcard & Study Panel */
    .study-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .study-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .flashcard {
      background: var(--surface-2);
      border: 2px solid var(--border);
      border-radius: var(--radius-xl);
      min-height: 290px;
      padding: 26px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
      user-select: none;
    }

    .flashcard:hover { border-color: var(--primary); }
    .flashcard.flipped { background: var(--primary-soft); border-color: var(--primary); }

    .fc-emoji { font-size: 3.4rem; margin-bottom: 8px; }
    .fc-word { font-size: 2rem; font-weight: 900; color: var(--text); letter-spacing: -0.02em; }
    .fc-ipa { font-size: 1rem; color: var(--muted); margin-top: 2px; }
    .fc-meaning { font-size: 1.45rem; font-weight: 800; color: var(--primary-dark); margin: 8px 0; }
    .fc-example-row {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }
    .fc-example { font-size: 0.98rem; color: var(--text); max-width: 560px; }
    .fc-example-vi { font-size: 0.88rem; color: var(--muted); font-style: italic; margin-top: 4px; }
    .fc-hint { font-size: 0.82rem; color: var(--muted); margin-top: 14px; }

    .btn-mini-audio {
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--primary);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .btn-mini-audio:hover {
      background: var(--primary);
      color: #ffffff;
    }

    .audio-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: var(--radius-md);
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-amber { background: var(--amber); color: #fff; }
    .btn-ghost { background: #eef2f7; color: var(--text); }

    .fc-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
    }

    /* Quiz / Riddle */
    .quiz-box { max-width: 680px; margin: 0 auto; }

    .riddle-prompt {
      background: var(--primary-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      font-size: 1.06rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 640px) {
      .options-grid { grid-template-columns: 1fr 1fr; }
    }

    .option-btn {
      text-align: left;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      padding: 13px 15px;
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .option-btn:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-soft); }
    .option-btn.correct { background: var(--success-soft); border-color: var(--success); color: var(--success); }
    .option-btn.wrong { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }

    /* Spelling & Builder */
    .spell-slots {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 18px 0;
    }

    .slot {
      width: 42px;
      height: 48px;
      border-radius: 12px;
      border: 2px dashed #cbd5e1;
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .slot.filled {
      border-style: solid;
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary-dark);
    }

    .letter-pool {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .letter-tile {
      min-width: 44px;
      height: 46px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: 0 3px 0 #cbd5e1;
      font-size: 1.15rem;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
    }

    .letter-tile:disabled { opacity: 0.35; cursor: default; box-shadow: none; }

    /* Grammar Cards */
    .grammar-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 14px;
    }

    .grammar-card h3 { font-size: 1.06rem; color: var(--primary-dark); margin-bottom: 8px; }

    .formula-box {
      background: var(--amber-soft);
      border: 1px solid #fde68a;
      color: #92400e;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .feedback-banner {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.94rem;
    }

    .feedback-ok { background: var(--success-soft); color: var(--success); border: 1px solid #a7f3d0; }
    .feedback-err { background: var(--danger-soft); color: var(--danger); border: 1px solid #fecaca; }

    .footer-tools {
      margin-top: 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      box-shadow: var(--shadow);
      color: var(--muted);
      font-size: 0.84rem;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-group">
        <a class="home-link" href="./index.html">← Trang chủ</a>
        <div class="app-title" id="appTitle">🌟 Cambridge Kids</div>
      </div>

      <nav class="main-tabs" aria-label="Phân hệ học tập">
        <button class="main-tab active" id="tabVocab" onclick="switchSection('vocab')">📚 Từ Vựng</button>
        <button class="main-tab" id="tabGrammar" onclick="switchSection('grammar')">🧩 Ngữ Pháp</button>
      </nav>

      <div class="stats-bar">
        <span class="pill pill-star">⭐ <span id="starCount">0</span></span>
        <span class="pill pill-streak">🔥 <span id="streakCount">0</span></span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero-banner">
      <div>
        <h1 id="heroTitle">Kho Từ Vựng & Ngữ Pháp Cambridge Kids</h1>
        <p id="heroSubtitle">Chạm vào thẻ để nghe phát âm chuẩn, luyện đố định nghĩa, chính tả và ngữ pháp.</p>
      </div>
      <div class="level-switcher" aria-label="Chuyển cấp độ">
        <a class="lvl-chip" id="lvl-starters" href="./learn.html?level=starters">Pre A1 Starters</a>
        <a class="lvl-chip" id="lvl-movers" href="./learn.html?level=movers">A1 Movers</a>
        <a class="lvl-chip" id="lvl-flyers" href="./learn.html?level=flyers">A2 Flyers</a>
      </div>
    </section>

    <div class="mode-bar" id="modeBar"></div>
    <div id="appRoot"></div>

    <footer class="footer-tools">
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;">
        <span id="dataSourceStatus">⏳ Đang tải dữ liệu bài học...</span>
        <button class="btn btn-ghost" style="padding:6px 12px;font-size:0.8rem;" onclick="resetProgress()">Đặt lại tiến độ</button>
      </div>
      <div style="margin-top:16px;padding-top:14px;border-top:1px dashed var(--border);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;">
      <span>✉️ Góp ý tác giả: <a href="mailto:vlab.smartapps@gmail.com" style="color:var(--primary);font-weight:700;text-decoration:none;">vlab.smartapps@gmail.com</a></span>
      <a href="mailto:vlab.smartapps@gmail.com?subject=G%C3%B3p%20%C3%BD%20%E1%BB%A9ng%20d%E1%BB%A5ng%20Cambridge%20Kids" style="font-size:0.82rem;font-weight:700;color:var(--muted);text-decoration:none;">Gửi email góp ý →</a>
    </div>
    </footer>
  </main>

  <script>
    const LEVEL_CONFIG = {
      starters: {
        key: "starters",
        badge: "Pre A1 Starters",
        appTitle: "🌟 Pre A1 Starters Kids",
        pageTitle: "Cambridge Pre A1 Starters — Học Từ Vựng & Ngữ Pháp Cho Bé",
        heroTitle: "Kho Từ Vựng Cambridge Pre A1 Starters",
        vocabSubtitle: "Làm quen từ vựng cơ bản qua hình ảnh, phát âm, đố vui và ghép chữ.",
        grammarSubtitle: "Nắm chắc 8–10 điểm ngữ pháp nền tảng Starters qua công thức, trắc nghiệm và ghép câu.",
        storageKey: "starters_kids_progress_v1",
        theme: {
          primary: "#059669",
          primaryDark: "#047857",
          primarySoft: "#ecfdf5"
        },
        vocabFiles: ["./StarterKids/vocab_starters.js?v=1", "./vocab_starters.js?v=1"],
        grammarFiles: ["./StarterKids/grammar_starters.js?v=1", "./grammar_starters.js?v=1"],
        getVocab: () => window.STARTERS_VOCAB_TOPICS || window.VOCAB_STARTERS || [],
        getGrammar: () => window.STARTERS_GRAMMAR_LESSONS || window.GRAMMAR_STARTERS || [],
        getSentences: () => window.STARTERS_GRAMMAR_SENTENCES || []
      },
      movers: {
        key: "movers",
        badge: "A1 Movers",
        appTitle: "🚀 A1 Movers Kids",
        pageTitle: "Cambridge A1 Movers — Học Từ Vựng & Ngữ Pháp Cho Bé",
        heroTitle: "Kho Từ Vựng Cambridge A1 Movers",
        vocabSubtitle: "Mở rộng vốn từ A1 Movers qua Flashcard 2 tốc độ, đố định nghĩa và chính tả.",
        grammarSubtitle: "Luyện thì quá khứ, so sánh, động từ khiếm khuyết và ghép câu chuẩn A1 Movers.",
        storageKey: "movers_kids_progress_v1",
        theme: {
          primary: "#7c3aed",
          primaryDark: "#6d28d9",
          primarySoft: "#f5f3ff"
        },
        vocabFiles: ["./MoverKids/vocab_movers.js?v=1", "./vocab_movers.js?v=1"],
        grammarFiles: ["./MoverKids/grammar_movers.js?v=1", "./grammar_movers.js?v=1"],
        getVocab: () => window.MOVERS_VOCAB_TOPICS || window.VOCAB_MOVERS || [],
        getGrammar: () => window.MOVERS_GRAMMAR_LESSONS || window.GRAMMAR_MOVERS || [],
        getSentences: () => window.MOVERS_GRAMMAR_SENTENCES || []
      },
      flyers: {
        key: "flyers",
        badge: "A2 Flyers",
        appTitle: "✈️ A2 Flyers Kids",
        pageTitle: "Cambridge A2 Flyers — Học Từ Vựng & Ngữ Pháp Cho Bé",
        heroTitle: "Kho Từ Vựng Cambridge A2 Flyers",
        vocabSubtitle: "Chạm vào thẻ để nghe phát âm chuẩn, luyện đố định nghĩa và chính tả.",
        grammarSubtitle: "Học công thức, làm trắc nghiệm, ghép câu hoàn chỉnh và tự động ôn lại câu làm sai.",
        storageKey: "flyers_kids_progress_v3",
        theme: {
          primary: "#2563eb",
          primaryDark: "#1d4ed8",
          primarySoft: "#eff6ff"
        },
        vocabFiles: ["./FlyerKids/vocab_flyers.js?v=1", "./vocab_flyers.js?v=1"],
        grammarFiles: ["./FlyerKids/grammar_flyers.js?v=1", "./grammar_flyers.js?v=1"],
        getVocab: () => window.FLYERS_VOCAB_TOPICS || window.FLYERS_EXTRA_TOPICS || [],
        getGrammar: () => window.FLYERS_GRAMMAR_LESSONS || window.FLYERS_EXTRA_GRAMMAR || [],
        getSentences: () => window.FLYERS_GRAMMAR_SENTENCES || []
      }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const requestedLevel = (urlParams.get("level") || "flyers").toLowerCase();
    const currentConfig = LEVEL_CONFIG[requestedLevel] || LEVEL_CONFIG.flyers;

    document.title = currentConfig.pageTitle;
    document.getElementById("appTitle").textContent = currentConfig.appTitle;
    document.getElementById("heroTitle").textContent = currentConfig.heroTitle;
    document.getElementById("heroSubtitle").textContent = currentConfig.vocabSubtitle;
    document.documentElement.style.setProperty("--primary", currentConfig.theme.primary);
    document.documentElement.style.setProperty("--primary-dark", currentConfig.theme.primaryDark);
    document.documentElement.style.setProperty("--primary-soft", currentConfig.theme.primarySoft);

    const activeChip = document.getElementById("lvl-" + currentConfig.key);
    if (activeChip) activeChip.classList.add("active");

    function loadScriptWithFallback(candidates) {
      return new Promise((resolve) => {
        let idx = 0;
        function tryNext() {
          if (idx >= candidates.length) {
            resolve(false);
            return;
          }
          const script = document.createElement("script");
          script.src = candidates[idx++];
          script.onload = () => resolve(true);
          script.onerror = () => {
            script.remove();
            tryNext();
          };
          document.body.appendChild(script);
        }
        tryNext();
      });
    }

    let ALL_TOPICS = [];
    let ALL_WORDS = [];
    let GRAMMAR_LESSONS = [];
    let CUSTOM_SENTENCES = [];

    const STORAGE_KEY = currentConfig.storageKey;
    let state = loadState();

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        return {
          stars: saved.stars || 0,
          streak: saved.streak || 0,
          mastered: Array.isArray(saved.mastered) ? saved.mastered : [],
          reviewWords: Array.isArray(saved.reviewWords) ? saved.reviewWords : [],
          grammarWrong: Array.isArray(saved.grammarWrong) ? saved.grammarWrong : []
        };
      } catch (e) {
        return { stars: 0, streak: 0, mastered: [], reviewWords: [], grammarWrong: [] };
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
      updateTopStats();
    }

    function updateTopStats() {
      document.getElementById("starCount").textContent = state.stars;
      document.getElementById("streakCount").textContent = state.streak;
    }

    let currentSection = "vocab";
    let vocabMode = "topics";
    let selectedTopicId = "";
    let cardIndex = 0;
    let cardFlipped = false;
    let currentDeckWords = [];

    let quizWord = null;
    let quizOptions = [];
    let quizAnswered = false;
    let quizChosenWord = "";

    let spellWord = null;
    let spellPool = [];
    let spellPicked = [];

    let grammarMode = "lessons";
    let gQuizIndex = 0;
    let gQuizAnswered = false;
    let gQuizChosen = -1;
    let builderIndex = 0;
    let builderTokens = [];
    let builderPicked = [];

    let audioCtx = null;
    function playTone(freq, duration = 0.14, type = "sine") {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function speak(text, rate = 0.95) {
      if (!("speechSynthesis" in window)) return;
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "en-GB";
        utter.rate = rate;
        const voices = window.speechSynthesis.getVoices();
        const preferred = voices.find((v) => /en-(GB|US)/i.test(v.lang) && /Daniel|Serena|Samantha|Google UK/i.test(v.name))
          || voices.find((v) => /en-(GB|US)/i.test(v.lang));
        if (preferred) utter.voice = preferred;
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    }

    function speakFromBtn(btn, rate = 0.95) {
      if (!btn) return;
      const text = btn.getAttribute("data-speech") || "";
      if (text) speak(text, rate);
    }

    function addStar(n = 1) {
      state.stars += n;
      state.streak += 1;
      playTone(660, 0.12);
      setTimeout(() => playTone(880, 0.16), 90);
      saveState();
    }

    function breakStreak() {
      state.streak = 0;
      playTone(220, 0.22, "sawtooth");
      saveState();
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function getExampleVi(w) {
      if (w.exampleVi) return w.exampleVi;
      if (w.example_vi) return w.example_vi;
      return `Ví dụ minh họa cho từ “${w.word}” (${w.meaning}).`;
    }

    function switchSection(sec) {
      currentSection = sec;
      document.getElementById("tabVocab").classList.toggle("active", sec === "vocab");
      document.getElementById("tabGrammar").classList.toggle("active", sec === "grammar");
      document.getElementById("heroTitle").textContent = sec === "vocab"
        ? currentConfig.heroTitle
        : `Ngữ Pháp Trọng Tâm ${currentConfig.badge}`;
      document.getElementById("heroSubtitle").textContent = sec === "vocab"
        ? currentConfig.vocabSubtitle
        : currentConfig.grammarSubtitle;
      render();
    }

    function getActiveWords() {
      if (vocabMode === "review") {
        const list = ALL_WORDS.filter((w) => state.reviewWords.includes(w.word));
        return list.length ? list : ALL_WORDS.slice(0, 12);
      }
      const topic = ALL_TOPICS.find((t) => t.id === selectedTopicId) || ALL_TOPICS[0];
      return topic ? topic.words : [];
    }

    function setVocabMode(mode) {
      vocabMode = mode;
      cardIndex = 0;
      cardFlipped = false;
      quizAnswered = false;
      quizChosenWord = "";
      if (mode === "riddle") prepareRiddle();
      if (mode === "spell") prepareSpell();
      render();
    }

    function openTopic(topicId) {
      selectedTopicId = topicId;
      vocabMode = "flashcard";
      cardIndex = 0;
      cardFlipped = false;
      render();
    }

    function toggleMastered(word) {
      if (state.mastered.includes(word)) {
        state.mastered = state.mastered.filter((w) => w !== word);
      } else {
        state.mastered.push(word);
        addStar(1);
      }
      state.reviewWords = state.reviewWords.filter((w) => w !== word);
      saveState();
      render();
    }

    function markForReview(word) {
      if (!state.reviewWords.includes(word)) state.reviewWords.push(word);
      saveState();
    }

    function prepareRiddle() {
      const pool = getActiveWords();
      if (!pool.length) return;
      quizWord = pool[Math.floor(Math.random() * pool.length)];
      const others = ALL_WORDS.filter((w) => w.word !== quizWord.word)
        .sort(() => Math.random() - 0.5)
        .slice(0, 3);
      quizOptions = [quizWord, ...others].sort(() => Math.random() - 0.5);
      quizAnswered = false;
      quizChosenWord = "";
    }

    function checkRiddle(chosen) {
      if (quizAnswered || !quizWord) return;
      quizAnswered = true;
      quizChosenWord = chosen;
      speak(quizWord.word);
      if (chosen === quizWord.word) {
        addStar(2);
        if (!state.mastered.includes(quizWord.word)) state.mastered.push(quizWord.word);
        state.reviewWords = state.reviewWords.filter((w) => w !== quizWord.word);
      } else {
        breakStreak();
        markForReview(quizWord.word);
      }
      saveState();
      render();
    }

    function prepareSpell() {
      const pool = getActiveWords().filter((w) => !w.word.includes(" "));
      const source = pool.length ? pool : getActiveWords();
      if (!source.length) return;
      spellWord = source[Math.floor(Math.random() * source.length)];
      const letters = spellWord.word.replace(/\s+/g, "").split("");
      spellPool = letters.map((ch, idx) => ({ ch, idx })).sort(() => Math.random() - 0.5);
      spellPicked = [];
    }

    function pickLetter(poolIdx) {
      if (!spellWord) return;
      const cleanTarget = spellWord.word.replace(/\s+/g, "");
      if (spellPicked.length >= cleanTarget.length) return;
      spellPicked.push(poolIdx);
      const current = spellPicked.map((i) => spellPool[i].ch).join("");
      if (current.length === cleanTarget.length) {
        speak(spellWord.word);
        if (current.toLowerCase() === cleanTarget.toLowerCase()) {
          addStar(2);
          if (!state.mastered.includes(spellWord.word)) state.mastered.push(spellWord.word);
        } else {
          breakStreak();
          markForReview(spellWord.word);
        }
        saveState();
      }
      render();
    }

    function renderModeBar() {
      const bar = document.getElementById("modeBar");
      if (currentSection === "vocab") {
        bar.innerHTML = `
          <button class="mode-btn ${vocabMode === "topics" ? "active" : ""}" onclick="setVocabMode('topics')">🗂️ Chọn Chủ Đề (${ALL_TOPICS.length})</button>
          <button class="mode-btn ${vocabMode === "flashcard" ? "active" : ""}" onclick="setVocabMode('flashcard')">🃏 Flashcard</button>
          <button class="mode-btn ${vocabMode === "riddle" ? "active" : ""}" onclick="setVocabMode('riddle')">🧠 Đố Định Nghĩa</button>
          <button class="mode-btn ${vocabMode === "spell" ? "active" : ""}" onclick="setVocabMode('spell')">⌨️ Chính Tả</button>
          <button class="mode-btn ${vocabMode === "review" ? "active" : ""}" onclick="setVocabMode('review')">🔁 Ôn Từ Khó (${state.reviewWords.length})</button>
        `;
      } else {
        bar.innerHTML = `
          <button class="mode-btn ${grammarMode === "lessons" ? "active" : ""}" onclick="grammarMode='lessons';render()">📖 Thẻ Công Thức (${GRAMMAR_LESSONS.length})</button>
          <button class="mode-btn ${grammarMode === "quiz" ? "active" : ""}" onclick="grammarMode='quiz';gQuizIndex=0;gQuizAnswered=false;gQuizChosen=-1;render()">🎯 Trắc Nghiệm</button>
          <button class="mode-btn ${grammarMode === "builder" ? "active" : ""}" onclick="setGrammarBuilder(0)">🧱 Ghép Câu</button>
          <button class="mode-btn ${grammarMode === "review" ? "active" : ""}" onclick="grammarMode='review';gQuizIndex=0;gQuizAnswered=false;gQuizChosen=-1;render()">🔁 Ôn Câu Sai (${state.grammarWrong.length})</button>
        `;
      }
    }

    function render() {
      renderModeBar();
      const root = document.getElementById("appRoot");

      if (currentSection === "grammar") {
        renderGrammar(root);
        return;
      }

      if (!ALL_TOPICS.length) {
        root.innerHTML = `
          <div class="study-panel" style="text-align:center;padding:32px 20px;">

          </div>
        `;

                  </div>

                      <span>Đã thuộc: ${done}/${t.words.length}</span>
                      <span>${pct}%</span>
                    </div>
                    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
                  </div>
                </article>
              `;
            }).join("")}
          </div>
        `;
        return;
      }

      const words = getActiveWords();
      currentDeckWords = words;
      const topic = ALL_TOPICS.find((t) => t.id === selectedTopicId) || ALL_TOPICS[0];

      if (vocabMode === "flashcard" || vocabMode === "review") {

              <button class="btn btn-ghost" onclick="setVocabMode('topics')">← Đổi chủ đề</button>
            </div>

            <div class="flashcard ${cardFlipped ? "flipped" : ""}" onclick="cardFlipped=!cardFlipped;render()">
              <div class="fc-emoji">${w.emoji || "✨"}</div>
              <div class="fc-word">${escapeHtml(w.word)}</div>
              <div class="fc-ipa">${escapeHtml(w.ipa || "")}</div>

              <div class="audio-row" onclick="event.stopPropagation()">
                <button class="btn btn-primary" data-speech="${escapeHtml(w.word)}" onclick="speakFromBtn(this, 0.95)">🔊 Nghe chuẩn</button>
                <button class="btn btn-ghost" data-speech="${escapeHtml(w.word)}" onclick="speakFromBtn(this, 0.65)">🐢 Nghe chậm</button>
              </div>

              ${
                cardFlipped
                  ? `<div style="margin-top:16px;">
                       <div class="fc-meaning">${escapeHtml(w.meaning)}</div>
                       <div class="fc-example-row">
                         <span class="fc-example">“${escapeHtml(exampleText)}”</span>
                         <button class="btn-mini-audio" data-speech="${escapeHtml(exampleText)}" onclick="event.stopPropagation();speakFromBtn(this, 0.9)">🔊 Nghe ví dụ</button>
                       </div>
                       <div class="fc-example-vi">🇻🇳 ${escapeHtml(getExampleVi(w))}</div>
                     </div>`
                  : `<div class="fc-hint">👆 Chạm vào thẻ để lật xem nghĩa tiếng Việt & câu ví dụ</div>`
              }
            </div>

            <div class="fc-controls">
              <button class="btn btn-ghost" onclick="cardIndex=(cardIndex-1+currentDeckWords.length)%currentDeckWords.length;cardFlipped=false;render()">← Trước</button>
              <button class="btn ${isDone ? "btn-success" : "btn-amber"}" onclick="toggleMastered('${escapeHtml(w.word)}')">
                ${isDone ? "✅ Đã thuộc từ này" : "⭐ Đánh dấu đã thuộc"}
              </button>
              <button class="btn btn-primary" onclick="cardIndex=(cardIndex+1)%currentDeckWords.length;cardFlipped=false;render()">Tiếp →</button>
            </div>
          </div>
        `;
        return;
      }

      if (vocabMode === "riddle") {
        if (!quizWord) prepareRiddle();
        const promptText = quizWord.riddle || `Which word means “${quizWord.meaning}”?`;
        root.innerHTML = `
          <div class="study-panel">
            <div class="study-header">
              <strong>🧠 Đố Định Nghĩa — ${escapeHtml(topic.name)}</strong>
              <button class="btn btn-amber" data-speech="${escapeHtml(promptText)}" onclick="speakFromBtn(this, 0.9)">🔊 Nghe câu đố</button>
            </div>
            <div class="quiz-box">
              <div class="riddle-prompt">“${escapeHtml(promptText)}”</div>
              <div class="options-grid">
                ${quizOptions
                  .map((opt) => {
                    let cls = "option-btn";
                    if (quizAnswered) {
                      if (opt.word === quizWord.word) cls += " correct";
                      else if (opt.word === quizChosenWord) cls += " wrong";
                    }
                    return `<button class="${cls}" ${quizAnswered ? "disabled" : ""} onclick="checkRiddle('${escapeHtml(opt.word)}')">${opt.emoji || "✨"} ${escapeHtml(opt.word)}</button>`;
                  })
                  .join("")}
              </div>
              ${
                quizAnswered
                  ? `<div class="feedback-banner ${quizChosenWord === quizWord.word ? "feedback-ok" : "feedback-err"}">
                       ${quizChosenWord === quizWord.word ? "✅ Chính xác! " : "❌ Chưa đúng rồi! "}
                       Đáp án: <strong>${escapeHtml(quizWord.word)}</strong> (${escapeHtml(quizWord.meaning)})
                     </div>
                     <div style="margin-top:14px;text-align:right;">
                       <button class="btn btn-primary" onclick="prepareRiddle();render()">Câu tiếp theo →</button>
                     </div>`
                  : ""
              }
            </div>
          </div>
        `;
        return;
      }

      if (vocabMode === "spell") {
        if (!spellWord) prepareSpell();
        const cleanTarget = spellWord.word.replace(/\s+/g, "");
        const typed = spellPicked.map((i) => spellPool[i].ch).join("");
        const finished = typed.length === cleanTarget.length;
        const isCorrect = typed.toLowerCase() === cleanTarget.toLowerCase();

        root.innerHTML = `
          <div class="study-panel">
            <div class="study-header">
              <strong>⌨️ Luyện Chính Tả — ${escapeHtml(topic.name)}</strong>
              <button class="btn btn-primary" data-speech="${escapeHtml(spellWord.word)}" onclick="speakFromBtn(this, 0.85)">🔊 Nghe lại từ</button>
            </div>

            <div style="text-align:center;">
              <div style="font-size:3rem;">${spellWord.emoji || "✨"}</div>
              <div style="font-size:1.25rem;font-weight:800;margin-top:4px;">${escapeHtml(spellWord.meaning)}</div>
              <div style="color:var(--muted);font-size:0.9rem;">${escapeHtml(spellWord.ipa || "")}</div>

              <div class="spell-slots">
                ${cleanTarget
                  .split("")
                  .map((_, i) => `<div class="slot ${typed[i] ? "filled" : ""}">${typed[i] || ""}</div>`)
                  .join("")}
              </div>

              <div class="letter-pool">
                ${spellPool
                  .map(
                    (item, idx) =>
                      `<button class="letter-tile" ${spellPicked.includes(idx) ? "disabled" : ""} onclick="pickLetter(${idx})">${escapeHtml(item.ch)}</button>`
                  )
                  .join("")}
              </div>

              <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;">
                <button class="btn btn-ghost" onclick="spellPicked.pop();render()">⌫ Xóa 1 chữ</button>
                <button class="btn btn-ghost" onclick="spellPicked=[];render()">🔄 Làm lại</button>
                <button class="btn btn-primary" onclick="prepareSpell();render()">Từ khác →</button>
              </div>

              ${
                finished
                  ? `<div class="feedback-banner ${isCorrect ? "feedback-ok" : "feedback-err"}">
                      ${
                        isCorrect
                          ? `🎉 Tuyệt vời! Từ chính xác là “${escapeHtml(spellWord.word)}” (+2 ⭐)`
                          : `❌ Chưa đúng rồi. Đáp án chuẩn là: <strong>${escapeHtml(spellWord.word)}</strong>`
                      }
                    </div>`
                  : ""
              }
            </div>
          </div>
        `;
      }
    }

    function getAllGrammarQuestions() {
      return GRAMMAR_LESSONS.flatMap((g, gIdx) =>
        (g.questions || []).map((q, idx) => ({
          ...q,
          qid: `${g.id || gIdx}__${idx}`,
          topic: g.title
        }))
      );
    }

    function getGrammarSentences() {
      if (Array.isArray(CUSTOM_SENTENCES) && CUSTOM_SENTENCES.length > 0) {
        return CUSTOM_SENTENCES;
      }
      const derived = GRAMMAR_LESSONS.filter((g) => g.example && g.example.split(" ").length >= 4).map((g) => ({
        topic: g.title,
        vi: g.exampleVi || g.tip || g.title,
        en: g.example
      }));
      return derived.length ? derived : [
        { topic: "Mẫu câu cơ bản", vi: "Tôi đang đọc một cuốn sách thú vị.", en: "I am reading an interesting book." }
      ];
    }

    function setGrammarBuilder(idx) {
      grammarMode = "builder";
      const list = getGrammarSentences();
      builderIndex = ((idx % list.length) + list.length) % list.length;
      const cleanTokens = list[builderIndex].en.split(" ");
      builderTokens = cleanTokens
        .map((word, i) => ({ word, i }))
        .sort(() => Math.random() - 0.5);
      builderPicked = [];
      render();
    }

    function pickBuilderToken(idx) {
      const list = getGrammarSentences();
      const target = list[builderIndex];
      const targetWords = target.en.split(" ");
      if (builderPicked.length >= targetWords.length) return;
      builderPicked.push(idx);
      if (builderPicked.length === targetWords.length) {
        const built = builderPicked.map((i) => builderTokens[i].word).join(" ");
        speak(target.en, 0.9);
        if (built === target.en) addStar(2);
        else breakStreak();
      }
      render();
    }

    function renderGrammar(root) {
      if (!GRAMMAR_LESSONS.length) {
        root.innerHTML = `
          <div class="study-panel" style="text-align:center;padding:32px 20px;">
            <h3>⚠️ Chưa tìm thấy file dữ liệu ngữ pháp cho cấp độ ${escapeHtml(currentConfig.badge)}</h3>
            <p style="color:var(--muted);margin-top:8px;">Hãy kiểm tra lại đường dẫn file <code>${escapeHtml(currentConfig.grammarFiles[0])}</code> trong cấu hình <code>LEVEL_CONFIG</code> của <code>learn.html</code>.</p>
          </div>
        `;
        return;
      }

      if (grammarMode === "lessons") {
        root.innerHTML = GRAMMAR_LESSONS.map(
          (g) => `
            <article class="grammar-card">
              <h3>🧩 ${escapeHtml(g.title)}</h3>
              <div class="formula-box">${escapeHtml(g.formula || "")}</div>
              <p style="margin-bottom:8px;"><strong>Mẹo nhớ:</strong> ${escapeHtml(g.tip || g.usage || "")}</p>
              ${
                g.example
                  ? `<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;">
                       <span>📌 Ví dụ: <em>${escapeHtml(g.example)}</em></span>
                       <button class="btn btn-primary" data-speech="${escapeHtml(g.example)}" onclick="speakFromBtn(this, 0.9)">🔊 Nghe ví dụ</button>
                     </div>`
                  : ""
              }
            </article>
          `
        ).join("");
        return;
      }

      if (grammarMode === "builder") {
        const list = getGrammarSentences();
        const item = list[builderIndex];
        const targetWords = item.en.split(" ");
        const built = builderPicked.map((i) => builderTokens[i].word).join(" ");
        const isDone = builderPicked.length === targetWords.length;
        const isRight = built === item.en;

        root.innerHTML = `
          <div class="study-panel">
            <div class="study-header">
              <strong>🧱 Ghép Câu Hoàn Chỉnh (${builderIndex + 1}/${list.length}) — ${escapeHtml(item.topic || currentConfig.badge)}</strong>
              <button class="btn btn-amber" data-speech="${escapeHtml(item.en)}" onclick="speakFromBtn(this, 0.85)">🔊 Nghe mẫu</button>

            <div class="quiz-box">
              <div class="riddle-prompt">

              <div class="spell-slots" style="min-height:64px;padding:12px;background:#f8fafc;border-radius:16px;border:1px solid var(--border);">

                            `<button class="btn btn-primary" style="padding:8px 12px;" onclick="builderPicked.splice(${pos},1);render()">${escapeHtml(builderTokens[tokIdx].word)}</button>`
                        )
                        .join("")
                    : `<span style="color:var(--muted);font-size:0.92rem;">👆 Chạm vào các từ bên dưới theo đúng thứ tự câu...</span>`
                }
              </div>

              <div class="letter-pool" style="gap:10px;">
                ${builderTokens
                  .map(
                    (tok, idx) =>
                      `<button class="btn btn-ghost" style="border:1px solid var(--border);${builderPicked.includes(idx) ? "opacity:0.35;" : ""}" ${builderPicked.includes(idx) ? "disabled" : ""} onclick="pickBuilderToken(${idx})">${escapeHtml(tok.word)}</button>`
                  )
                  .join("")}
              </div>

              <div class="fc-controls">
                <button class="btn btn-ghost" onclick="builderPicked.pop();render()">⌫ Bỏ từ cuối</button>
                <button class="btn btn-ghost" onclick="builderPicked=[];render()">🔄 Xếp lại</button>
                <button class="btn btn-primary" onclick="setGrammarBuilder(builderIndex + 1)">Câu tiếp theo →</button>
              </div>

              ${
                isDone
                  ? `<div class="feedback-banner ${isRight ? "feedback-ok" : "feedback-err"}">
                       ${
                         isRight
                           ? `🎉 Xuất sắc! Câu hoàn chỉnh chính xác (+2 ⭐)`
                           : `❌ Chưa đúng thứ tự rồi. Câu chuẩn là: <strong>${escapeHtml(item.en)}</strong>`
                       }
                     </div>`
                  : ""
              }
            </div>
          </div>
        `;
        return;
      }

      const allQ = getAllGrammarQuestions();
      const pool = grammarMode === "review"
        ? allQ.filter((q) => state.grammarWrong.includes(q.qid))
        : allQ;

      if (!pool.length) {
        root.innerHTML = `
          <div class="study-panel" style="text-align:center;padding:40px 20px;">
            <h2>${grammarMode === "review" ? "🎉 Tuyệt vời! Bé chưa có câu ngữ pháp nào làm sai." : "Chưa có câu hỏi trắc nghiệm nào."}</h2>
            <p style="color:var(--muted);margin:10px 0 18px;">Hãy thử sức ở phần Trắc Nghiệm hoặc Ghép Câu nhé.</p>
            <button class="btn btn-primary" onclick="grammarMode='quiz';gQuizIndex=0;gQuizAnswered=false;gQuizChosen=-1;render()">Luyện Trắc Nghiệm Ngữ Pháp</button>
          </div>
        `;
        return;
      }

      const item = pool[gQuizIndex % pool.length];
      root.innerHTML = `
        <div class="study-panel">
          <div class="study-header">
            <strong>${grammarMode === "review" ? "🔁 Ôn Câu Sai" : "🎯 Trắc Nghiệm"} (${(gQuizIndex % pool.length) + 1}/${pool.length}) — ${escapeHtml(item.topic)}</strong>
          </div>
          <div class="quiz-box">
            <div class="riddle-prompt">${escapeHtml(item.q)}</div>
            <div class="options-grid">
              ${item.opts
                .map((opt, idx) => {
                  let cls = "option-btn";
                  if (gQuizAnswered) {
                    if (idx === item.ans) cls += " correct";
                    else if (idx === gQuizChosen) cls += " wrong";
                  }
                  return `<button class="${cls}" ${gQuizAnswered ? "disabled" : ""} onclick="answerGrammar(${idx}, ${item.ans}, '${escapeHtml(item.qid)}')">${escapeHtml(opt)}</button>`;
                })
                .join("")}
            </div>
            ${
              gQuizAnswered
                ? `<div class="feedback-banner ${gQuizChosen === item.ans ? "feedback-ok" : "feedback-err"}">
                     ${gQuizChosen === item.ans ? "✅ Chính xác! " : "❌ Chưa đúng rồi! "}💡 ${escapeHtml(item.exp || "")}
                   </div>
                   <div style="margin-top:14px;text-align:right;">
                     <button class="btn btn-primary" onclick="gQuizIndex++;gQuizAnswered=false;gQuizChosen=-1;render()">Câu tiếp theo →</button>
                   </div>`
                : ""
            }
          </div>
        </div>
      `;
    }

    function answerGrammar(chosen, ans, qid) {
      gQuizAnswered = true;
      gQuizChosen = chosen;
      if (chosen === ans) {
        addStar(1);
        state.grammarWrong = state.grammarWrong.filter((id) => id !== qid);
      } else {
        breakStreak();
        if (qid && !state.grammarWrong.includes(qid)) state.grammarWrong.push(qid);
      }
      saveState();
      render();
    }

    function resetProgress() {
      if (!confirm(`Đặt lại toàn bộ số sao và tiến độ của cấp độ ${currentConfig.badge} trên thiết bị này?`)) return;
      state = { stars: 0, streak: 0, mastered: [], reviewWords: [], grammarWrong: [] };
      saveState();
      render();
    }

    Promise.all([
      loadScriptWithFallback(currentConfig.vocabFiles),
      loadScriptWithFallback(currentConfig.grammarFiles)
    ]).then(() => {
      const rawVocab = currentConfig.getVocab();
      ALL_TOPICS = Array.isArray(rawVocab)
        ? rawVocab.map((t, idx) => ({
            ...t,
            id: t.id || `topic_${idx}`,
            name: t.name || `Chủ đề ${idx + 1}`,
            en: t.en || currentConfig.badge,
            icon: t.icon || "📚",
            words: Array.isArray(t.words) ? t.words : []
          }))
        : [];
      ALL_WORDS = ALL_TOPICS.flatMap((t) => t.words);
      selectedTopicId = ALL_TOPICS.length > 0 ? ALL_TOPICS[0].id : "";

      const rawGrammar = currentConfig.getGrammar();
      GRAMMAR_LESSONS = Array.isArray(rawGrammar) ? rawGrammar : [];

      const rawSentences = currentConfig.getSentences();
      CUSTOM_SENTENCES = Array.isArray(rawSentences) ? rawSentences : [];

      const totalQ = GRAMMAR_LESSONS.reduce((acc, g) => acc + (g.questions ? g.questions.length : 0), 0);
      document.getElementById("dataSourceStatus").textContent =
        `✅ ${currentConfig.badge}: ${ALL_WORDS.length} từ (${ALL_TOPICS.length} chủ đề) • ${GRAMMAR_LESSONS.length} chuyên đề ngữ pháp (${totalQ} câu)`;

      updateTopStats();
      render();
    });
  </script>
</body>
</html>
