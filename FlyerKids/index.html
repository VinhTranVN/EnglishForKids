<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="A2 Flyers Kids" />
  <title>Cambridge A2 Flyers — Học Từ Vựng & Ngữ Pháp Cho Bé</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #172033;
      --muted: #5a687d;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-soft: #eff6ff;
      --success: #059669;
      --success-soft: #ecfdf5;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --amber: #d97706;
      --amber-soft: #fffbeb;
      --purple: #7c3aed;
      --purple-soft: #f5f3ff;
      --shadow: 0 10px 28px rgba(23, 32, 51, 0.06);
      --radius: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top left, #e0ecff 0%, var(--bg) 42%, #eef2ff 100%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      padding-bottom: 56px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }

    .topbar-inner {
      max-width: 1040px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.85rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: 999px;
      transition: all 0.15s ease;
    }

    .home-link:hover {
      color: var(--primary);
      border-color: #93c5fd;
      background: var(--primary-soft);
    }

    .app-title {
      font-weight: 800;
      font-size: 1.08rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .main-tabs {
      display: inline-flex;
      background: #eef2f7;
      padding: 4px;
      border-radius: 14px;
      gap: 4px;
    }

    .main-tab {
      border: none;
      background: transparent;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .main-tab.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .stats-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      border: 1px solid var(--border);
      background: var(--surface);
    }

    .pill-star { background: var(--amber-soft); border-color: #fde68a; color: #b45309; }
    .pill-streak { background: var(--danger-soft); border-color: #fecaca; color: #b91c1c; }

    .container {
      max-width: 1040px;
      margin: 22px auto 0;
      padding: 0 16px;
    }

    .hero-banner {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 22px 24px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .hero-banner h1 {
      font-size: clamp(1.3rem, 2.6vw, 1.75rem);
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .hero-banner p {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .badge-count {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--success-soft);
      color: var(--success);
      font-weight: 700;
      font-size: 0.82rem;
      padding: 6px 12px;
      border-radius: 999px;
    }

    .mode-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .mode-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 10px 15px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.15s ease;
    }

    .mode-btn:hover { border-color: #93c5fd; }

    .mode-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.22);
    }

    .topic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
      gap: 14px;
    }

    .topic-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .topic-card:hover {
      transform: translateY(-3px);
      border-color: #93c5fd;
      box-shadow: 0 14px 30px rgba(23, 32, 51, 0.09);
    }

    .topic-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .topic-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 1.4rem;
      background: var(--primary-soft);
    }

    .topic-count {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: #f1f5f9;
      color: var(--muted);
    }

    .topic-card h3 {
      font-size: 1.05rem;
      margin-bottom: 2px;
    }

    .topic-en {
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 600;
    }

    .progress-track {
      height: 7px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--success);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .study-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .study-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .btn {
      border: none;
      border-radius: 13px;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.15s ease;
    }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-success:hover { background: #047857; }
    .btn-amber { background: var(--amber-soft); color: #b45309; border: 1px solid #fde68a; }
    .btn-ghost { background: #f1f5f9; color: var(--text); }
    .btn-ghost:hover { background: #e2e8f0; }

    .flashcard-box {
      max-width: 560px;
      margin: 0 auto;
      text-align: center;
    }

    .flashcard {
      background: linear-gradient(145deg, #ffffff, #f8fbff);
      border: 2px solid #dbeafe;
      border-radius: 24px;
      padding: 32px 22px;
      min-height: 290px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 12px 26px rgba(37, 99, 235, 0.08);
      margin-bottom: 18px;
      transition: transform 0.18s ease;
    }

    .flashcard:hover { transform: scale(1.01); }

    .fc-emoji { font-size: 3.4rem; }
    .fc-word { font-size: 2rem; font-weight: 800; color: var(--primary); letter-spacing: -0.02em; }
    .fc-ipa { font-size: 1rem; color: var(--muted); font-family: monospace; }
    .fc-meaning { font-size: 1.45rem; font-weight: 800; color: var(--success); }
    .fc-example {
      background: var(--primary-soft);
      color: #1e3a8a;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.95rem;
      max-width: 460px;
    }

    .audio-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .fc-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .quiz-box {
      max-width: 640px;
      margin: 0 auto;
    }

    .riddle-prompt {
      background: var(--amber-soft);
      border: 1px solid #fde68a;
      border-radius: 18px;
      padding: 20px;
      font-size: 1.12rem;
      font-weight: 600;
      color: #78350f;
      margin-bottom: 16px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .option-btn {
      background: var(--surface-2);
      border: 2px solid var(--border);
      border-radius: 15px;
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.15s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .option-btn.correct {
      background: var(--success-soft);
      border-color: var(--success);
      color: var(--success);
    }

    .option-btn.wrong {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: var(--danger);
    }

    .spell-slots {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 18px 0;
      min-height: 52px;
    }

    .slot-box {
      min-width: 42px;
      height: 48px;
      padding: 0 10px;
      border-radius: 12px;
      border: 2px dashed #93c5fd;
      background: var(--primary-soft);
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--primary);
      display: grid;
      place-items: center;
    }

    .letter-pool {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 18px;
    }

    .letter-tile {
      width: 44px;
      height: 46px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: 0 3px 0 #cbd5e1;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
    }

    .letter-tile:disabled {
      opacity: 0.35;
      cursor: default;
      box-shadow: none;
    }

    .grammar-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .formula-box {
      background: var(--purple-soft);
      border: 1px solid #ddd6fe;
      color: #5b21b6;
      font-weight: 700;
      padding: 12px 14px;
      border-radius: 12px;
      margin: 10px 0;
      font-size: 0.96rem;
    }

    .feedback-banner {
      padding: 12px 16px;
      border-radius: 14px;
      font-weight: 700;
      margin-top: 12px;
    }

    .feedback-ok { background: var(--success-soft); color: var(--success); }
    .feedback-err { background: var(--danger-soft); color: var(--danger); }

    .footer-tools {
      margin-top: 28px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-group">
        <a class="home-link" href="../index.html">← Trang chủ</a>
        <div class="app-title">🚀 A2 Flyers Kids</div>
      </div>

      <nav class="main-tabs" aria-label="Phân hệ học tập">
        <button class="main-tab active" id="tabVocab" onclick="switchSection('vocab')">📚 Từ Vựng</button>
        <button class="main-tab" id="tabGrammar" onclick="switchSection('grammar')">🧩 Ngữ Pháp</button>
      </nav>

      <div class="stats-bar">
        <span class="pill pill-star">⭐ <span id="starCount">0</span></span>
        <span class="pill pill-streak">🔥 <span id="streakCount">0</span></span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero-banner">
      <div>
        <h1 id="heroTitle">Kho Từ Vựng Cambridge A2 Flyers</h1>
        <p id="heroSubtitle">Luyện nghe phát âm, đoán từ qua định nghĩa và ghép chính tả chuẩn đề thi Flyers.</p>
      </div>
      <div class="badge-count" id="totalWordBadge">📦 Đang tải kho từ...</div>
    </section>

    <div id="modeBar" class="mode-bar"></div>
    <div id="appContent"></div>

    <div class="footer-tools">
      <span id="dataSourceStatus">Nguồn dữ liệu: Từ vựng lõi + vocab_flyers.js</span>
      <button class="btn btn-ghost" onclick="resetProgress()">🔄 Đặt lại tiến độ</button>
    </div>
  </main>

  <!-- Nạp gói từ vựng mở rộng cùng thư mục FlyerKids/ -->
  <script src="./vocab_flyers.js"></script>

    // Gộp tự động gói mở rộng từ vocab_flyers.js nếu có
    const ALL_TOPICS = [...BASE_TOPICS];
    if (Array.isArray(window.FLYERS_EXTRA_TOPICS) && window.FLYERS_EXTRA_TOPICS.length > 0) {
      window.FLYERS_EXTRA_TOPICS.forEach((extraTopic) => {
        const existing = ALL_TOPICS.find((t) => t.id === extraTopic.id);
        if (existing) {
          const seen = new Set(existing.words.map((w) => w.word.toLowerCase()));
          extraTopic.words.forEach((w) => {
            if (!seen.has(w.word.toLowerCase())) existing.words.push(w);
          });
        } else {
          ALL_TOPICS.push(extraTopic);
        }
      });
    }

    const ALL_WORDS = ALL_TOPICS.flatMap((t) =>
      t.words.map((w) => ({ ...w, topicId: t.id, topicName: t.name }))
    );

    const BASE_GRAMMAR_LESSONS = [
      {
        id: "past_cont",

        questions: [

        questions: [
          { q: "You ___ whisper in the library.", opts: ["must", "mustn't", "might"], ans: 1, exp: "Nội quy thư viện không được nói to -> mustn't (không được phép) hoặc must whisper (phải nói thầm). Ở đây câu là 'whisper' nên đáp án đúng là 'must'!", ans: 0 },
          { q: "Take an umbrella. It ___ rain later.", opts: ["might", "mustn't", "can't"], ans: 0, exp: "'Might' diễn tả khả năng có thể xảy ra (50/50)." }

      },
      {

        title: "Câu điều kiện loại 0 & loại 1",

        example: "If it rains tomorrow, we will stay inside and play chess.",
        questions: [
          { q: "If she studies hard, she ___ pass the Flyers exam.", opts: ["will", "would", "did"], ans: 0, exp: "Câu điều kiện loại 1: If + hiện tại đơn, S + will + V." },
          { q: "If you heat ice, it ___ into water.", opts: ["turns", "turned", "will turning"], ans: 0, exp: "Sự thật hiển nhiên (loại 0): cả hai vế chia hiện tại đơn." }
        ]
      },
      {
        id: "relative_tags",
        title: "Đại từ quan hệ & Câu hỏi đuôi",
        formula: "who (người) | which (vật) | where (nơi chốn)",
        tip: "Câu hỏi đuôi: Vế trước khẳng định -> đuôi phủ định (và ngược lại).",
        example: "An astronaut is a person who travels into space.",
        questions: [
          { q: "A dictionary is a book ___ explains the meanings of words.", opts: ["who", "which", "where"], ans: 1, exp: "'A book' là đồ vật nên dùng đại từ quan hệ 'which'." },
          { q: "You like strawberry yoghurt, ___?", opts: ["don't you", "aren't you", "didn't you"], ans: 0, exp: "Vế trước dùng động từ thường 'like' (hiện tại đơn) -> đuôi là 'don't you'." }
        ]
      }
    ];

const GRAMMAR_LESSONS = [...BASE_GRAMMAR_LESSONS];
    if (Array.isArray(window.FLYERS_EXTRA_GRAMMAR) && window.FLYERS_EXTRA_GRAMMAR.length > 0) {
      window.FLYERS_EXTRA_GRAMMAR.forEach((extraLesson) => {
        const existing = GRAMMAR_LESSONS.find((g) => g.id === extraLesson.id);
        if (existing) {
          extraLesson.questions.forEach((q) => existing.questions.push(q));
        } else {
          GRAMMAR_LESSONS.push(extraLesson);
        }
      });
    }

    const STORAGE_KEY = "flyers_kids_progress_v2";
    let state = loadState();
    let currentSection = "vocab";
    let vocabMode = "topics"; // topics | flashcard | riddle | spelling | review
    let selectedTopicId = ALL_TOPICS[0].id;
    let cardIndex = 0;
    let cardFlipped = false;
    let quizItem = null;
    let quizAnswered = false;
    let spellLetters = [];
    let spellPicked = [];
    let grammarMode = "lessons"; // lessons | quiz | builder | review
    let gQuizIndex = 0;
    let gQuizAnswered = false;
    let gQuizChosen = -1;
    let builderIndex = 0;
    let builderTokens = [];
    let builderPicked = [];

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        return {
          stars: saved.stars || 0,
          streak: saved.streak || 0,
          mastered: Array.isArray(saved.mastered) ? saved.mastered : [],
          reviewWords: Array.isArray(saved.reviewWords) ? saved.reviewWords : [],
          grammarWrong: Array.isArray(saved.grammarWrong) ? saved.grammarWrong : []
        };
      } catch (e) {
        return { stars: 0, streak: 0, mastered: [], reviewWords: [], grammarWrong: [] };
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
      document.getElementById("starCount").textContent = state.stars;
      document.getElementById("streakCount").textContent = state.streak;
    }

    function addStar(points = 1) {
      state.stars += points;
      state.streak += 1;
      saveState();
    }

    function breakStreak(word) {
      state.streak = 0;
      if (word && !state.reviewWords.includes(word)) {
        state.reviewWords.push(word);
      }
      saveState();
    }

    function speak(text, rate = 0.95) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-GB";
      u.rate = rate;
      window.speechSynthesis.speak(u);
    }

    function getActiveWords() {
      if (vocabMode === "review") {
        const list = ALL_WORDS.filter((w) => state.reviewWords.includes(w.word));
        return list.length ? list : ALL_WORDS.slice(0, 10);
      }
      const topic = ALL_TOPICS.find((t) => t.id === selectedTopicId) || ALL_TOPICS[0];
      return topic.words;
    }

    function switchSection(sec) {
      currentSection = sec;
      document.getElementById("tabVocab").classList.toggle("active", sec === "vocab");
      document.getElementById("tabGrammar").classList.toggle("active", sec === "grammar");

      if (sec === "vocab") {
        document.getElementById("heroTitle").textContent = "Kho Từ Vựng Cambridge A2 Flyers";
        document.getElementById("heroSubtitle").textContent = "Học theo chủ đề, nghe 2 tốc độ, đố định nghĩa và luyện chính tả.";
        document.getElementById("totalWordBadge").textContent = `📦 ${ALL_TOPICS.length} chủ đề • ${ALL_WORDS.length} từ vựng`;
      } else {
        document.getElementById("heroTitle").textContent = "Ngữ Pháp Trọng Tâm A2 Flyers";
        document.getElementById("heroSubtitle").textContent = "Học công thức, làm trắc nghiệm, ghép câu hoàn chỉnh và tự động ôn lại câu làm sai.";
        document.getElementById("totalWordBadge").textContent = `🧩 ${GRAMMAR_LESSONS.length} chuyên đề ngữ pháp`;
      }
      render();
    }

    function setVocabMode(mode) {
      vocabMode = mode;
      cardIndex = 0;
      cardFlipped = false;
      quizAnswered = false;
      if (mode === "riddle") prepareRiddle();
      if (mode === "spelling") prepareSpelling();
      render();
    }

    function openTopic(topicId) {
      selectedTopicId = topicId;
      setVocabMode("flashcard");
    }

    function prepareRiddle() {
      const pool = getActiveWords();
      const target = pool[Math.floor(Math.random() * pool.length)];
      const distractors = ALL_WORDS.filter((w) => w.word !== target.word)
        .sort(() => Math.random() - 0.5)
        .slice(0, 3);
      const options = [target, ...distractors].sort(() => Math.random() - 0.5);
      quizItem = { target, options };
      quizAnswered = false;
    }

    function prepareSpelling() {
      const pool = getActiveWords();
      const target = pool[cardIndex % pool.length];
      quizItem = { target };
      quizAnswered = false;
      const chars = target.word.split("");
      spellLetters = chars
        .map((ch, idx) => ({ ch, idx }))
        .sort(() => Math.random() - 0.5);
      spellPicked = [];
    }

    function renderModeBar() {
      const bar = document.getElementById("modeBar");
      if (currentSection === "vocab") {
        const modes = [
          { id: "topics", label: "🗂️ Chọn Chủ Đề" },
          { id: "flashcard", label: "🃏 Flashcard" },
          { id: "riddle", label: "❓ Đố Định Nghĩa" },
          { id: "spelling", label: "🐝 Chính Tả" },
          { id: "review", label: `🔁 Ôn Từ Khó (${state.reviewWords.length})` }
        ];
        bar.innerHTML = modes
          .map((m) => `<button class="mode-btn ${vocabMode === m.id ? "active" : ""}" onclick="setVocabMode('${m.id}')">${m.label}</button>`)
          .join("");
      } else {
        bar.innerHTML = `
          <button class="mode-btn ${grammarMode === "lessons" ? "active" : ""}" onclick="grammarMode='lessons';render()">📖 Thẻ Công Thức</button>
          <button class="mode-btn ${grammarMode === "quiz" ? "active" : ""}" onclick="grammarMode='quiz';gQuizIndex=0;gQuizAnswered=false;gQuizChosen=-1;render()">🎯 Trắc Nghiệm</button>
          <button class="mode-btn ${grammarMode === "builder" ? "active" : ""}" onclick="setGrammarBuilder(0)">🧱 Ghép Câu</button>
          <button class="mode-btn ${grammarMode === "review" ? "active" : ""}" onclick="grammarMode='review';gQuizIndex=0;gQuizAnswered=false;gQuizChosen=-1;render()">🔁 Ôn Câu Sai (${state.grammarWrong.length})</button>
        `;
      }
    }

    function render() {
      renderModeBar();
      const root = document.getElementById("appContent");

      if (currentSection === "grammar") {
        renderGrammar(root);
        return;
      }

      if (vocabMode === "topics") {
        root.innerHTML = `
          <div class="topic-grid">
            ${ALL_TOPICS.map((t) => {
              const done = t.words.filter((w) => state.mastered.includes(w.word)).length;
              const pct = Math.round((done / t.words.length) * 100);
              return `
                <article class="topic-card" onclick="openTopic('${t.id}')">
                  <div>
                    <div class="topic-head">
                      <div class="topic-icon">${t.icon}</div>
                      <span class="topic-count">${done}/${t.words.length} từ</span>
                    </div>
                    <h3>${t.name}</h3>
                    <div class="topic-en">${t.en}</div>
                  </div>
                  <div class="progress-track">
                    <div class="progress-fill" style="width:${pct}%"></div>
                  </div>
                </article>
              `;
            }).join("")}
          </div>
        `;
        return;
      }

      const topic = ALL_TOPICS.find((t) => t.id === selectedTopicId) || ALL_TOPICS[0];
      const words = getActiveWords();

      if (vocabMode === "flashcard" || vocabMode === "review") {
        if (vocabMode === "review" && state.reviewWords.length === 0) {
          root.innerHTML = `
            <div class="study-panel" style="text-align:center;padding:40px 20px;">
              <h2>🎉 Tuyệt vời! Bé chưa có từ khó nào cần ôn lại.</h2>
              <p style="color:var(--muted);margin:10px 0 18px;">Hãy luyện thêm ở các chủ đề hoặc thử sức với trò Đố Định Nghĩa nhé.</p>
              <button class="btn btn-primary" onclick="setVocabMode('topics')">Chọn chủ đề học tiếp</button>
            </div>
          `;
          return;
        }

        const item = words[cardIndex % words.length];
        const isMastered = state.mastered.includes(item.word);
        root.innerHTML = `
          <div class="study-panel">
            <div class="study-header">
              <strong>${vocabMode === "review" ? "🔁 Ôn tập từ khó" : `${topic.icon} ${topic.name}`} (${(cardIndex % words.length) + 1}/${words.length})</strong>
              <button class="btn btn-ghost" onclick="setVocabMode('topics')">← Đổi chủ đề</button>
            </div>

            <div class="flashcard-box">
              <div class="audio-row">
                <button class="btn btn-primary" onclick="speak('${item.word.replace(/'/g, "\'")}', 0.95)">🔊 Nghe thường</button>
                <button class="btn btn-amber" onclick="speak('${item.word.replace(/'/g, "\'")}', 0.6)">🐢 Nghe chậm</button>
              </div>

              <div class="flashcard" onclick="cardFlipped=!cardFlipped;render()">
                <div class="fc-emoji">${item.emoji}</div>
                <div class="fc-word">${item.word}</div>
                <div class="fc-ipa">${item.ipa}</div>
                ${
                  cardFlipped
                    ? `<div class="fc-meaning">${item.meaning}</div>
                       <div class="fc-example">“${item.example}”</div>`
                    : `<div style="color:var(--muted);font-size:0.9rem;">👆 Chạm vào thẻ để xem nghĩa & ví dụ</div>`
                }
              </div>

              <div class="fc-controls">
                <button class="btn btn-ghost" onclick="cardIndex=(cardIndex-1+words.length)%words.length;cardFlipped=false;render()">← Trước</button>
                <button class="btn btn-success" onclick="markMastered('${item.word.replace(/'/g, "\'")}')">
                  ${isMastered ? "✅ Đã thuộc" : "⭐ Đánh dấu đã thuộc"}
                </button>
                <button class="btn btn-amber" onclick="markReview('${item.word.replace(/'/g, "\'")}')">📌 Cần ôn lại</button>
                <button class="btn btn-primary" onclick="cardIndex=(cardIndex+1)%words.length;cardFlipped=false;render()">Tiếp →</button>
              </div>
            </div>
          </div>
        `;
        return;
      }

      if (vocabMode === "riddle") {
        if (!quizItem) prepareRiddle();
        const { target, options } = quizItem;
        root.innerHTML = `
          <div class="study-panel">
            <div class="study-header">
              <strong>❓ Đố Vui Định Nghĩa — Chủ đề: ${topic.name}</strong>
              <button class="btn btn-ghost" onclick="setVocabMode('topics')">← Đổi chủ đề</button>
            </div>

            <div class="quiz-box">
              <div class="riddle-prompt">
                💡 <em>"${target.riddle}"</em>
                <div style="margin-top:10px;">
                  <button class="btn btn-amber" onclick="speak('${target.riddle.replace(/'/g, "\'")}', 0.9)">🔊 Nghe câu gợi ý</button>
                </div>
              </div>

              <div class="options-grid">
                ${options
                  .map((opt) => {
                    let cls = "option-btn";
                    if (quizAnswered) {
                      if (opt.word === target.word) cls += " correct";
                    }
                    return `<button class="${cls}" ${quizAnswered ? "disabled" : ""} onclick="checkRiddle('${opt.word.replace(/'/g, "\'")}')">
                      <span>${opt.emoji}</span>
                      <span>${opt.word}</span>
                    </button>`;
                  })
                  .join("")}
              </div>

              ${
                quizAnswered
                  ? `<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;">
                       <span><strong>${target.word}</strong> (${target.ipa}): ${target.meaning}</span>
                       <button class="btn btn-primary" onclick="prepareRiddle();render()">Câu tiếp theo →</button>
                     </div>`
                  : ""
              }
            </div>
          </div>
        `;
        return;
      }

      if (vocabMode === "spelling") {
        if (!quizItem) prepareSpelling();
        const { target } = quizItem;
        const currentGuess = spellPicked.map((i) => spellLetters[i].ch).join("");
        const isComplete = currentGuess.length === target.word.length;
        const isRight = currentGuess.toLowerCase() === target.word.toLowerCase();

        root.innerHTML = `
          <div class="study-panel">
            <div class="study-header">
              <strong>🐝 Thử Thách Chính Tả — ${topic.name}</strong>
              <button class="btn btn-ghost" onclick="setVocabMode('topics')">← Đổi chủ đề</button>
            </div>

            <div class="flashcard-box">
              <div style="font-size:3rem;margin-bottom:6px;">${target.emoji}</div>
              <div style="font-size:1.2rem;font-weight:800;margin-bottom:4px;">${target.meaning}</div>
              <div style="color:var(--muted);font-size:0.9rem;margin-bottom:12px;">${target.riddle}</div>

              <div class="audio-row">
                <button class="btn btn-primary" onclick="speak('${target.word.replace(/'/g, "\'")}', 0.9)">🔊 Nghe từ</button>
                <button class="btn btn-amber" onclick="speak('${target.word.replace(/'/g, "\'")}', 0.55)">🐢 Đọc chậm</button>
              </div>

              <div class="spell-slots">
                ${target.word
                  .split("")
                  .map((_, i) => `<div class="slot-box">${spellPicked[i] !== undefined ? spellLetters[spellPicked[i]].ch : ""}</div>`)
                  .join("")}
              </div>

              <div class="letter-pool">
                ${spellLetters
                  .map(
                    (item, idx) =>
                      `<button class="letter-tile" ${spellPicked.includes(idx) ? "disabled" : ""} onclick="pickLetter(${idx})">${item.ch}</button>`
                  )
                  .join("")}
              </div>

              <div class="fc-controls">
                <button class="btn btn-ghost" onclick="spellPicked.pop();render()">⌫ Xóa 1 chữ</button>
                <button class="btn btn-ghost" onclick="spellPicked=[];render()">🔄 Xếp lại</button>
                <button class="btn btn-primary" onclick="cardIndex++;prepareSpelling();render()">Từ tiếp theo →</button>
              </div>

              ${
                isComplete
                  ? `<div class="feedback-banner ${isRight ? "feedback-ok" : "feedback-err"}">
                       ${
                         isRight
                           ? `🎉 Chính xác tuyệt đối! "${target.word}" (+1 ⭐)`
                           : `❌ Chưa đúng rồi (${currentGuess}). Đáp án đúng là: <strong>${target.word}</strong>`
                       }
                     </div>`
                  : ""
              }
            </div>
          </div>
        `;
      }
    }

    function markMastered(word) {
      if (!state.mastered.includes(word)) {
        state.mastered.push(word);
        addStar(1);
      }
      state.reviewWords = state.reviewWords.filter((w) => w !== word);
      saveState();
      render();
    }

    function markReview(word) {
      if (!state.reviewWords.includes(word)) state.reviewWords.push(word);
      saveState();
      cardIndex++;
      cardFlipped = false;
      render();
    }

    function checkRiddle(chosen) {
      quizAnswered = true;
      const target = quizItem.target;
      speak(target.word, 0.95);
      if (chosen === target.word) {
        addStar(1);
        if (!state.mastered.includes(target.word)) state.mastered.push(target.word);
      } else {
        breakStreak(target.word);
      }
      saveState();
      render();
    }

    function pickLetter(idx) {
      const target = quizItem.target;
      if (spellPicked.length >= target.word.length) return;
      spellPicked.push(idx);
      const currentGuess = spellPicked.map((i) => spellLetters[i].ch).join("");
      if (currentGuess.length === target.word.length) {
        speak(target.word, 0.95);
        if (currentGuess.toLowerCase() === target.word.toLowerCase()) {
          addStar(2);
          if (!state.mastered.includes(target.word)) state.mastered.push(target.word);
        } else {
          breakStreak(target.word);
        }
        saveState();
      }
      render();
    }

    function getAllGrammarQuestions() {
      return GRAMMAR_LESSONS.flatMap((g) =>
        g.questions.map((q, idx) => ({
          ...q,
          qid: `${g.id}__${idx}`,
          topic: g.title
        }))
      );
    }

    function getGrammarSentences() {
      return [
        { topic: "Quá khứ tiếp diễn", vi: "Tôi đang đọc sách thì điện thoại reo.", en: "I was reading a book when the phone rang." },
        { topic: "Hiện tại hoàn thành", vi: "Bạn đã bao giờ nhìn thấy xương khủng long thật chưa?", en: "Have you ever seen a real dinosaur bone?" },
        { topic: "Tương lai Be going to", vi: "Nhìn những đám mây đen kia! Trời sắp mưa rồi.", en: "Look at those dark clouds! It is going to rain." },
        { topic: "Động từ khiếm khuyết", vi: "Bạn phải đội mũ bảo hiểm khi đi xe máy.", en: "You must wear a helmet when you ride a motorbike." },
        { topic: "Câu điều kiện loại 1", vi: "Nếu ngày mai trời mưa, chúng tôi sẽ ở trong nhà chơi cờ vua.", en: "If it rains tomorrow, we will stay inside and play chess." },
        { topic: "Đại từ quan hệ", vi: "Phi hành gia là người bay vào vũ trụ.", en: "An astronaut is a person who travels into space." },
        { topic: "Quá khứ tiếp diễn (While)", vi: "Trong khi chúng tôi đang dã ngoại ở công viên, trời bắt đầu mưa.", en: "While we were having a picnic in the park, it began to rain." },
        { topic: "Hiện tại hoàn thành (For)", vi: "Cô ấy đã sống ở thành phố này được năm năm rồi.", en: "She has lived in this city for five years." },
        { topic: "Nơi chốn với Where", vi: "Lâu đài là nơi các vị vua và hoàng hậu từng sinh sống.", en: "A castle is a place where kings and queens lived." },
        { topic: "Động từ + To-V", vi: "Chúng tôi quyết định mượn một vài cuốn sách từ thư viện.", en: "We decided to borrow some books from the library." },
        { topic: "So sánh hơn", vi: "Chiếc vòng tay bạc này đắt hơn chiếc vòng nhựa.", en: "This silver bracelet is more expensive than the plastic one." },
        { topic: "Câu hỏi đuôi", vi: "Bạn có thể bơi rất giỏi, phải không?", en: "You can swim very well, can't you?" }
      ];
    }

    function setGrammarBuilder(idx) {
      grammarMode = "builder";
      const list = getGrammarSentences();
      builderIndex = ((idx % list.length) + list.length) % list.length;
      const cleanTokens = list[builderIndex].en.split(" ");
      builderTokens = cleanTokens
        .map((word, i) => ({ word, i }))
        .sort(() => Math.random() - 0.5);
      builderPicked = [];
      render();
    }

    function pickBuilderToken(idx) {
      const list = getGrammarSentences();
      const target = list[builderIndex];
      const targetWords = target.en.split(" ");
      if (builderPicked.length >= targetWords.length) return;
      builderPicked.push(idx);
      if (builderPicked.length === targetWords.length) {
        const built = builderPicked.map((i) => builderTokens[i].word).join(" ");
        speak(target.en, 0.9);
        if (built === target.en) {
          addStar(2);
        } else {
          breakStreak();
        }
      }
      render();
    }

    function renderGrammar(root) {
      if (grammarMode === "lessons") {
        root.innerHTML = GRAMMAR_LESSONS.map(
          (g) => `
            <article class="grammar-card">
              <h3>🧩 ${g.title}</h3>
              <div class="formula-box">${g.formula}</div>
              <p style="margin-bottom:8px;"><strong>Mẹo nhớ:</strong> ${g.tip}</p>
              <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;">
                <span>📌 Ví dụ: <em>${g.example}</em></span>
                <button class="btn btn-primary" onclick="speak('${g.example.replace(/'/g, "\'")}', 0.9)">🔊 Nghe ví dụ</button>
              </div>
            </article>
          `
        ).join("");
        return;
      }

      if (grammarMode === "builder") {
        const list = getGrammarSentences();
        const item = list[builderIndex];
        const targetWords = item.en.split(" ");
        const built = builderPicked.map((i) => builderTokens[i].word).join(" ");
        const isDone = builderPicked.length === targetWords.length;
        const isRight = built === item.en;

        root.innerHTML = `
          <div class="study-panel">
            <div class="study-header">
              <strong>🧱 Ghép Câu Hoàn Chỉnh (${builderIndex + 1}/${list.length}) — ${item.topic}</strong>
              <button class="btn btn-amber" onclick="speak('${item.en.replace(/'/g, "\'")}', 0.85)">🔊 Nghe mẫu</button>
            </div>

            <div class="quiz-box">
              <div class="riddle-prompt">
                🇻🇳 Sắp xếp các mảnh từ thành câu tiếng Anh đúng:<br/>
                <strong>“${item.vi}”</strong>
              </div>

              <div class="spell-slots" style="min-height:64px;padding:12px;background:#f8fafc;border-radius:16px;border:1px solid var(--border);">
                ${
                  builderPicked.length
                    ? builderPicked
                        .map(
                          (tokIdx, pos) =>
                            `<button class="btn btn-primary" style="padding:8px 12px;" onclick="builderPicked.splice(${pos},1);render()">${builderTokens[tokIdx].word}</button>`
                        )
                        .join("")
                    : `<span style="color:var(--muted);font-size:0.92rem;">👆 Chạm vào các từ bên dưới theo đúng thứ tự câu...</span>`
                }
              </div>

              <div class="letter-pool" style="gap:10px;">
                ${builderTokens
                  .map(
                    (tok, idx) =>
                      `<button class="btn btn-ghost" style="border:1px solid var(--border);${builderPicked.includes(idx) ? "opacity:0.35;" : ""}" ${builderPicked.includes(idx) ? "disabled" : ""} onclick="pickBuilderToken(${idx})">${tok.word}</button>`
                  )
                  .join("")}
              </div>

              <div class="fc-controls">
                <button class="btn btn-ghost" onclick="builderPicked.pop();render()">⌫ Bỏ từ cuối</button>
                <button class="btn btn-ghost" onclick="builderPicked=[];render()">🔄 Xếp lại</button>
                <button class="btn btn-primary" onclick="setGrammarBuilder(builderIndex + 1)">Câu tiếp theo →</button>
              </div>

              ${
                isDone
                  ? `<div class="feedback-banner ${isRight ? "feedback-ok" : "feedback-err"}">
                       ${
                         isRight
                           ? `🎉 Xuất sắc! Câu hoàn chỉnh chính xác (+2 ⭐)`
                           : `❌ Chưa đúng thứ tự rồi. Câu chuẩn là: <strong>${item.en}</strong>`
                       }
                     </div>`
                  : ""
              }
            </div>
          </div>
        `;
        return;
      }

      const allQ = getAllGrammarQuestions();
      const pool = grammarMode === "review"
        ? allQ.filter((q) => state.grammarWrong.includes(q.qid))
        : allQ;

      if (grammarMode === "review" && pool.length === 0) {
        root.innerHTML = `
          <div class="study-panel" style="text-align:center;padding:40px 20px;">
            <h2>🎉 Tuyệt vời! Bé chưa có câu ngữ pháp nào làm sai.</h2>
            <p style="color:var(--muted);margin:10px 0 18px;">Hãy thử sức ở phần Trắc Nghiệm hoặc Ghép Câu nhé.</p>
            <button class="btn btn-primary" onclick="grammarMode='quiz';gQuizIndex=0;gQuizAnswered=false;gQuizChosen=-1;render()">Luyện Trắc Nghiệm Ngữ Pháp</button>
          </div>
        `;
        return;
      }

      const item = pool[gQuizIndex % pool.length];
      root.innerHTML = `
        <div class="study-panel">
          <div class="study-header">
            <strong>${grammarMode === "review" ? "🔁 Ôn Câu Sai" : "🎯 Trắc Nghiệm"} (${(gQuizIndex % pool.length) + 1}/${pool.length}) — ${item.topic}</strong>
          </div>
          <div class="quiz-box">
            <div class="riddle-prompt">${item.q}</div>
            <div class="options-grid">
              ${item.opts
                .map((opt, idx) => {
                  let cls = "option-btn";
                  if (gQuizAnswered) {
                    if (idx === item.ans) cls += " correct";
                    else if (idx === gQuizChosen) cls += " wrong";
                  }
                  return `<button class="${cls}" ${gQuizAnswered ? "disabled" : ""} onclick="answerGrammar(${idx}, ${item.ans}, '${item.qid}')">${opt}</button>`;
                })
                .join("")}
            </div>
            ${
              gQuizAnswered
                ? `<div class="feedback-banner ${gQuizChosen === item.ans ? "feedback-ok" : "feedback-err"}">
                     ${gQuizChosen === item.ans ? "✅ Chính xác! " : "❌ Chưa đúng rồi! "}💡 ${item.exp}
                   </div>
                   <div style="margin-top:14px;text-align:right;">
                     <button class="btn btn-primary" onclick="gQuizIndex++;gQuizAnswered=false;gQuizChosen=-1;render()">Câu tiếp theo →</button>
                   </div>`
                : ""
            }
          </div>
        </div>
      `;
    }

    function answerGrammar(chosen, ans, qid) {
      gQuizAnswered = true;
      gQuizChosen = chosen;
      if (chosen === ans) {
        addStar(1);
        state.grammarWrong = state.grammarWrong.filter((id) => id !== qid);
      } else {
        breakStreak();
        if (qid && !state.grammarWrong.includes(qid)) {
          state.grammarWrong.push(qid);
        }
      }
      saveState();
      render();
    }

    function resetProgress() {
      if (!confirm("Bạn có chắc muốn đặt lại toàn bộ Sao và tiến độ học trên thiết bị này?")) return;
      state = { stars: 0, streak: 0, mastered: [], reviewWords: [], grammarWrong: [] };
      saveState();
      render();
    }

    // Khởi tạo
    saveState();
    const extraVocabLoaded = Array.isArray(window.FLYERS_EXTRA_TOPICS) && window.FLYERS_EXTRA_TOPICS.length > 0;
    const extraGrammarLoaded = Array.isArray(window.FLYERS_EXTRA_GRAMMAR) && window.FLYERS_EXTRA_GRAMMAR.length > 0;
    const totalGrammarQ = GRAMMAR_LESSONS.reduce((acc, g) => acc + g.questions.length, 0);
    document.getElementById("dataSourceStatus").textContent =
      `✅ Từ vựng: ${ALL_WORDS.length} từ (${ALL_TOPICS.length} chủ đề${extraVocabLoaded ? " + mở rộng" : ""}) • Ngữ pháp: ${GRAMMAR_LESSONS.length} chuyên đề (${totalGrammarQ} câu${extraGrammarLoaded ? " + mở rộng" : ""})`;
    switchSection("vocab");
  </script>
</body>
</html>
