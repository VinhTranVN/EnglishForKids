<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Starter App — Từ Vựng & Ngữ Pháp</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent-bg: #eff6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 24px 16px 60px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 28px;
    }
    header h1 {
      font-size: 1.9rem;
      color: var(--primary);
      margin-bottom: 6px;
    }
    header p {
      color: var(--muted);
      font-size: 0.98rem;
    }
    .tabs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 24px;
    }
    .tab-btn {
      padding: 10px 20px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .search-box {
      margin-bottom: 20px;
    }
    .search-box input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 1rem;
      outline: none;
    }
    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--accent-bg);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }
    .word-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
    }
    .word {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
    }
    .phonetic {
      font-size: 0.9rem;
      color: var(--muted);
    }
    .meaning {
      font-weight: 600;
      margin-bottom: 10px;
    }
    .example {
      background: var(--accent-bg);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.92rem;
    }
    .example-vi {
      color: var(--muted);
      font-size: 0.86rem;
      margin-top: 2px;
    }
    .formula {
      display: inline-block;
      background: var(--accent-bg);
      color: var(--primary);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      margin: 8px 0;
      font-size: 0.9rem;
    }
    .usage {
      color: var(--muted);
      font-size: 0.92rem;
      margin-bottom: 10px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>English Starter App</h1>
      <p>Ôn tập từ vựng &amp; ngữ pháp tiếng Anh cơ bản</p>
    </header>

    <div class="tabs">
      <button id="tab-vocab" class="tab-btn active" onclick="switchTab('vocab')">Từ vựng (Vocab)</button>
      <button id="tab-grammar" class="tab-btn" onclick="switchTab('grammar')">Ngữ pháp (Grammar)</button>
    </div>

    <div class="search-box">
      <input id="search-input" type="text" placeholder="Tìm kiếm từ vựng, nghĩa hoặc cấu trúc ngữ pháp..." oninput="render()" />
    </div>

    <section id="vocab-section" class="grid"></section>
    <section id="grammar-section" class="grid hidden"></section>
  </div>

  <script src="vocab_starters.js"></script>
  <script src="grammar_starters.js"></script>
  <script>
    let currentTab = 'vocab';

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-vocab').classList.toggle('active', tab === 'vocab');
      document.getElementById('tab-grammar').classList.toggle('active', tab === 'grammar');
      document.getElementById('vocab-section').classList.toggle('hidden', tab !== 'vocab');
      document.getElementById('grammar-section').classList.toggle('hidden', tab !== 'grammar');
      render();
    }

    function render() {
      const q = (document.getElementById('search-input').value || '').trim().toLowerCase();

      const vocabList = (typeof VOCAB_STARTERS !== 'undefined' ? VOCAB_STARTERS : []).filter(item =>
        !q ||
        item.word.toLowerCase().includes(q) ||
        item.meaning.toLowerCase().includes(q) ||
        item.example.toLowerCase().includes(q)
      );

      document.getElementById('vocab-section').innerHTML = vocabList.length
        ? vocabList.map(item => `
          <article class="card">
            <div class="word-row">
              <span class="word">${item.word}</span>
              <span class="phonetic">${item.phonetic}</span>
            </div>
            <div class="meaning">${item.meaning}</div>
            <div class="example">
              <div>"${item.example}"</div>
              <div class="example-vi">${item.exampleVi}</div>
            </div>
          </article>
        `).join('')
        : '<p>Không tìm thấy từ vựng phù hợp.</p>';

      const grammarList = (typeof GRAMMAR_STARTERS !== 'undefined' ? GRAMMAR_STARTERS : []).filter(item =>
        !q ||
        item.title.toLowerCase().includes(q) ||
        item.formula.toLowerCase().includes(q) ||
        item.usage.toLowerCase().includes(q)
      );

      document.getElementById('grammar-section').innerHTML = grammarList.length
        ? grammarList.map(item => `
          <article class="card">
            <h3>${item.title}</h3>
            <div class="formula">${item.formula}</div>
            <p class="usage">${item.usage}</p>
            <div class="example">
              ${item.examples.map(ex => `
                <div style="margin-bottom:6px;">
                  <div>"${ex.en}"</div>
                  <div class="example-vi">${ex.vi}</div>
                </div>
              `).join('')}
            </div>
          </article>
        `).join('')
        : '<p>Không tìm thấy điểm ngữ pháp phù hợp.</p>';
    }

    render();
  </script>
</body>
</html>
